<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMW DS2 Диагностика</title>
<style>
  :root {
    --bar: #14233a; --bar2: #1d3253; --bg: #e9edf2; --card: #ffffff; --line: #d4dae3;
    /* цвета подобраны под контраст не ниже 4,5:1 на белом и на фоне */
    --text: #1b2430; --muted: #566170; --blue: #1677d2; --blue2: #0f5fae;
    --ok: #157a42; --warn: #a35f00; --err: #c62f2a;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  /* выделять текст можно везде, кроме панелей и кнопок */
  .topbar, .bottombar, .tile, button, #splash { -webkit-user-select: none; user-select: none; }

  /* Фокус с клавиатуры */
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .topbar :focus-visible, .bottombar :focus-visible, .dlg h4 :focus-visible { outline-color: #8cc4ff; }
  #view:focus { outline: none; }
  .skip { position: absolute; left: 8px; top: -80px; z-index: 300; background: var(--blue); color: #fff; padding: 12px 16px; border-radius: 8px; font-weight: 600; text-decoration: none; }
  .skip:focus { top: 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ico { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; }
  .ico svg { width: 100%; height: 100%; display: block; }

  /* Верхняя панель */
  .topbar { background: linear-gradient(var(--bar2), var(--bar)); color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 16px; height: 52px; flex: none; }
  .brand { font-weight: 700; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #fff; background: conic-gradient(#1677d2 0 25%, #fff 0 50%, #1677d2 0 75%, #fff 0); }
  .crumbs { flex: 1; display: flex; gap: 6px; align-items: center; font-size: 14px; color: #b9c6d8; overflow: hidden; white-space: nowrap; }
  .crumb { font: inherit; color: inherit; background: none; border: 0; padding: 0 4px; min-height: 44px; cursor: pointer; border-radius: 6px; white-space: nowrap; }
  .crumb:hover { color: #fff; }
  .crumb[aria-current] { color: #fff; cursor: default; }
  .crumbs i { font-style: normal; opacity: .5; }
  .vci { display: flex; align-items: center; gap: 8px; font-size: 13px; background: rgba(255,255,255,.08); padding: 5px 10px; border-radius: 6px; }
  .vci-short { display: none; }
  .vci .led { width: 10px; height: 10px; border-radius: 50%; background: #5b6b80; box-shadow: inset 0 0 2px #000; }
  .vci.on .led { background: #33d17a; box-shadow: 0 0 6px #33d17a; }
  .vci.demo .led { background: #ffb020; box-shadow: 0 0 6px #ffb020; }
  .clock { font-variant-numeric: tabular-nums; font-size: 13px; color: #b9c6d8; }

  /* Информационная строка автомобиля */
  .vehicle { background: var(--card); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; gap: 24px; font-size: 13px; color: var(--muted); flex: none; flex-wrap: wrap; }
  .vehicle b { color: var(--text); font-weight: 600; }

  /* Экран */
  .screen { flex: 1; overflow: auto; padding: 18px; }
  .screen > div { max-width: 1200px; margin: 0 auto; }
  .title { font-size: 18px; font-weight: 600; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  .title small { font-size: 13px; color: var(--muted); font-weight: 400; }

  .subhead { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 10px; }
  .title + .subhead { margin-top: 4px; }
  .readiness td:last-child { white-space: nowrap; }
  .dtc-sec { padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .dtc-sec b { color: var(--text); }

  /* Плитки */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .tile { font: inherit; color: inherit; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 12px 14px; text-align: center; cursor: pointer;
          box-shadow: 0 1px 2px rgba(0,0,0,.05); transition: transform .12s cubic-bezier(.2,.8,.2,1), box-shadow .15s; }
  .tile:hover:not(:disabled) { box-shadow: 0 4px 14px rgba(20,35,58,.15); transform: translateY(-1px); }
  .tile:active:not(:disabled) { transform: scale(.97); transition-duration: .06s; }
  .tile:disabled, .tile.off { opacity: .5; }
  .tile.off { cursor: help; }
  .tile .nm, .tile .ds { display: block; }
  .tile .ic { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 14px; display: grid; place-items: center; color: #fff; }
  .tile .ic svg { width: 34px; height: 34px; }
  .tile .nm { font-weight: 600; } .tile .ds { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .c1 { background: linear-gradient(#2b8ae6, #1466b8); } .c2 { background: linear-gradient(#26b06b, #158a4f); }
  .c3 { background: linear-gradient(#f39b1f, #d27800); } .c4 { background: linear-gradient(#e2514c, #b8302b); }
  .c5 { background: linear-gradient(#7d6ae0, #5845c2); } .c6 { background: linear-gradient(#5b6b80, #3e4b5c); }

  /* Таблицы */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table.grid { width: 100%; border-collapse: collapse; }
  .grid th { background: #f2f5f9; text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .grid td { padding: 11px 14px; border-bottom: 1px solid #edf0f4; }
  .grid tr:last-child td { border-bottom: none; }
  .grid tr.click { cursor: pointer; } .grid tr.click:hover td { background: #f5f9ff; }
  .grid tr.sel td { background: #e7f1fc; }
  .mono { font-family: var(--mono); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .b-ok { background: #e2f5ea; color: var(--ok); } .b-err { background: #fde8e7; color: var(--err); }
  .b-wait { background: #eef1f5; color: var(--muted); } .b-warn { background: #fff3dc; color: var(--warn); }
  .b-run { background: #e3effc; color: var(--blue); }
  .progress { height: 6px; background: #dfe4ea; border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .progress div { height: 100%; width: 100%; background: var(--blue); transform-origin: left; transform: scaleX(0); transition: transform .25s ease-out; }
  .hint { background: #fff8e6; border: 1px solid #f5dfa8; color: #7a5a00; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 14px; }
  .hint.info { background: #eaf3fd; border-color: #c6dcf5; color: #1d4f85; }
  .hint.bad { background: #fdecea; border-color: #f4c3c0; color: #8c201c; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .big-ok { padding: 36px; text-align: center; }
  .big-ok .n { font-size: 44px; font-weight: 700; } .big-ok .l { color: var(--muted); }

  .split { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; }
  @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
  canvas { width: 100%; height: 220px; display: block; }
  .graph-head { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .graph-head b { color: var(--text); font-size: 20px; font-family: var(--mono); margin-left: 6px; }

  input.field, select.field { font: inherit; font-family: var(--mono); padding: 9px 11px; min-height: 44px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--text); }
  label.lbl { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .form { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; padding: 14px; }

  #logbox { font-family: var(--mono); font-size: 12.5px; padding: 12px 14px; margin: 0; white-space: pre-wrap; word-break: break-all; min-height: 300px; max-height: 60vh; overflow: auto; background: #0e1724; color: #c9d4e3; user-select: text; }
  .tx { color: #79b4ff; } .rx { color: #7ee0a3; } .er { color: #ff8b86; } .inf { color: #8090a6; }

  .help p { margin: 0 0 10px; } .help { padding: 16px 18px; font-size: 14px; }
  .help h3 { margin: 16px 0 8px; font-size: 15px; } .help h3:first-child { margin-top: 0; }

  /* Карточки ошибок */
  .dtc { padding: 14px 16px; border-bottom: 1px solid #edf0f4; display: grid; grid-template-columns: 92px 1fr auto; gap: 4px 14px; align-items: start; }
  .dtc:last-child { border-bottom: none; }
  .dtc-code { font-family: var(--mono); font-weight: 700; font-size: 18px; color: var(--err); background: #fdecea; border-radius: 6px; text-align: center; padding: 6px 4px; }
  .dtc-code.unk { color: var(--muted); background: #eef1f5; }
  .dtc-code small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .dtc-plain { font-weight: 600; font-size: 15px; }
  .dtc-off { font-weight: 400; color: var(--muted); }
  .dtc-meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }
  .dtc-fix { grid-column: 2 / 4; background: #f6f8fb; border-radius: 8px; padding: 10px 14px; margin-top: 6px; font-size: 13.5px; }
  .dtc-fix b { display: block; margin-bottom: 4px; }
  .dtc-fix ol { margin: 0; padding-left: 20px; } .dtc-fix li { margin: 3px 0; }
  .dtc .lnk { font: inherit; font-size: 13px; color: var(--blue); background: none; border: 1px solid #c6dcf5; border-radius: 6px; padding: 5px 12px; min-height: 44px; cursor: pointer; white-space: nowrap; }
  .dtc .lnk:hover { background: #eaf3fd; }
  .sumbar { padding: 12px 16px; border-bottom: 1px solid var(--line); background: #fff7f6; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .sumbar b.n { font-size: 20px; color: var(--err); }
  .search { width: 100%; font: inherit; padding: 11px 14px; min-height: 48px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; background: #fff; color: var(--text); }
  @media (max-width: 600px) { .dtc { grid-template-columns: 70px 1fr; } .dtc-fix { grid-column: 1 / 3; } .dtc .lnk { grid-column: 1 / 3; justify-self: start; } }

  .okc { color: var(--ok) !important; background: #e2f5ea !important; }

  /* Переключатель темы */
  .themebtn { background: rgba(255,255,255,.08); border: 0; color: #c9d4e3; width: 44px; height: 44px; flex: none; border-radius: 8px; cursor: pointer; display: grid; place-items: center; transition: transform .1s; }
  .themebtn:hover { background: rgba(255,255,255,.16); color: #fff; }
  .themebtn:active { transform: scale(.92); }
  .themebtn[aria-pressed="true"] { background: rgba(255,255,255,.22); color: #fff; }
  .themebtn svg { width: 20px; height: 20px; }

  /* ===== Тёмная тема ===== */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bar: #0a0f17; --bar2: #142034; --bg: #0e131a; --card: #171e28; --line: #2a3441; --text: #e3e8ef; --muted: #8a96a6;
    --blue: #3b8ef0; --blue2: #2a78d6; --ok: #3ccf7c; --warn: #f2a93b; --err: #ff6b65;
  }
  :root[data-theme="dark"] .grid th { background: #1d2532; }
  :root[data-theme="dark"] .grid td { border-bottom-color: #232c38; }
  :root[data-theme="dark"] .grid tr.click:hover td { background: #1c2633; }
  :root[data-theme="dark"] .grid tr.sel td { background: #1a2d45; }
  :root[data-theme="dark"] .tile { box-shadow: none; }
  :root[data-theme="dark"] .tile:hover { box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  :root[data-theme="dark"] .b-ok { background: rgba(60,207,124,.15); }
  :root[data-theme="dark"] .b-err { background: rgba(255,107,101,.15); }
  :root[data-theme="dark"] .b-wait { background: #232c38; }
  :root[data-theme="dark"] .b-warn { background: rgba(242,169,59,.15); }
  :root[data-theme="dark"] .b-run { background: rgba(59,142,240,.18); }
  :root[data-theme="dark"] .progress { background: #232c38; }
  :root[data-theme="dark"] .hint { background: rgba(242,169,59,.09); border-color: rgba(242,169,59,.3); color: #f0c675; }
  :root[data-theme="dark"] .hint.info { background: rgba(59,142,240,.09); border-color: rgba(59,142,240,.3); color: #9cc7f7; }
  :root[data-theme="dark"] .hint.bad { background: rgba(255,107,101,.09); border-color: rgba(255,107,101,.3); color: #ffa29d; }
  :root[data-theme="dark"] input.field, :root[data-theme="dark"] select.field, :root[data-theme="dark"] .search { background: #0e131a; color: var(--text); border-color: var(--line); }
  :root[data-theme="dark"] .dlg { background: var(--card); color: var(--text); }
  :root[data-theme="dark"] .dlg button { background: #232c38; color: var(--text); border-color: var(--line); }
  :root[data-theme="dark"] .dlg button.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
  :root[data-theme="dark"] .dtc { border-bottom-color: #232c38; }
  :root[data-theme="dark"] .dtc-code { background: rgba(255,107,101,.12); }
  :root[data-theme="dark"] .dtc-code.unk { background: #232c38; }
  :root[data-theme="dark"] .dtc-fix { background: #1d2532; }
  :root[data-theme="dark"] .dtc .lnk { border-color: rgba(59,142,240,.4); }
  :root[data-theme="dark"] .dtc .lnk:hover { background: rgba(59,142,240,.12); }
  :root[data-theme="dark"] .sumbar { background: rgba(255,107,101,.06); }
  :root[data-theme="dark"] .okc { background: rgba(60,207,124,.15) !important; }
  :root[data-theme="dark"] #logbox { background: #0a0f17; }

  /* ===== Заставка ===== */
  #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; cursor: pointer;
            background: radial-gradient(circle at 50% 45%, #1b2c46 0%, #0a0f17 70%); color: #fff; transition: opacity .6s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }
  .sp-wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .sp-emblem { width: min(220px, 50vw); height: min(220px, 50vw); filter: drop-shadow(0 10px 40px rgba(22,119,210,.35)); animation: spIn 1s cubic-bezier(.2,.8,.2,1) both; }
  .sp-emblem img { width: 100%; height: 100%; object-fit: contain; }
  .sp-ring { stroke-dasharray: 600; stroke-dashoffset: 600; animation: spDraw 1.1s .15s ease-out forwards; }
  .sp-quads { transform-origin: 100px 100px; animation: spSpin 1.4s .3s cubic-bezier(.2,.8,.2,1) both; }
  .sp-text { font-weight: 700; letter-spacing: .5em; font-size: 11px; fill: #fff; opacity: 0; animation: spFade .6s 1s forwards; }
  .sp-title { font-size: 22px; font-weight: 600; letter-spacing: .08em; opacity: 0; animation: spUp .7s 1.1s forwards; }
  .sp-sub { font-size: 13px; color: #8a9bb3; letter-spacing: .2em; text-transform: uppercase; opacity: 0; animation: spUp .7s 1.3s forwards; }
  .sp-bar { width: 180px; height: 3px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; opacity: 0; animation: spFade .3s 1.3s forwards; }
  .sp-bar div { height: 100%; width: 0; background: linear-gradient(90deg, #1677d2, #6fb3ff); animation: spLoad 1.2s 1.4s ease-in-out forwards; }
  .sp-skip { position: absolute; bottom: 22px; font-size: 12px; color: #5d6d84; }
  @keyframes spIn { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes spDraw { to { stroke-dashoffset: 0; } }
  @keyframes spSpin { from { transform: rotate(-270deg) scale(.3); opacity: 0; } to { transform: rotate(0) scale(1); opacity: 1; } }
  @keyframes spFade { to { opacity: 1; } }
  @keyframes spUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes spLoad { to { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation-duration: .01s !important; animation-delay: 0s !important; transition: none; } }

  /* Нижняя панель */
  .bottombar { background: var(--bar); flex: none; display: flex; gap: 2px; padding: 6px 8px; }
  .bottombar button { flex: 0 0 auto; min-width: 92px; min-height: 52px; background: transparent; border: 0; color: #c9d4e3; border-radius: 8px; padding: 6px 10px;
                      font: inherit; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
                      transition: transform .1s, background-color .15s; }
  .bottombar button svg { width: 22px; height: 22px; }
  .bottombar button:hover:not(:disabled) { background: rgba(255,255,255,.08); color: #fff; }
  .bottombar button:active:not(:disabled) { transform: scale(.94); }
  .bottombar button:disabled { opacity: .4; cursor: not-allowed; }
  .bottombar button.busy { cursor: progress; }
  .bottombar button.busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .bottombar button.busy svg { animation: none; } }
  .bottombar button.act { background: var(--blue); color: #fff; }
  .bottombar button.act:hover:not(:disabled) { background: var(--blue2); }
  .bottombar button.red { color: #ff9c97; }
  .bottombar .sp { flex: 1; }

  /* ===== Приборы ===== */
  .gauges { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .gauge { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 10px;
           animation: gIn .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 80ms); }
  .g-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 22px; }
  .g-name { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .g-alert { display: none; align-items: center; gap: 4px; flex: none; font-size: 12px; font-weight: 700; color: var(--err); }
  .g-alert .ico { width: 14px; height: 14px; }
  .gauge.warn .g-alert { display: inline-flex; }
  .g-svg { display: block; width: 100%; max-width: 260px; margin: 2px auto 0; overflow: visible; }
  .g-track { fill: none; stroke: var(--line); stroke-width: 10; stroke-linecap: round; }
  .g-arc { fill: none; stroke-width: 10; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(22,119,210,.45)); }
  .g-warnzone { fill: none; stroke: var(--err); stroke-width: 3; opacity: .75; stroke-linecap: round; }
  .g-tick { stroke: var(--muted); stroke-width: 1.2; opacity: .55; } .g-tick.maj { stroke-width: 2.2; opacity: .9; }
  .g-lbl { fill: var(--muted); font: 11px var(--mono); text-anchor: middle; }
  .g-needle line { stroke: var(--err); stroke-width: 3.2; stroke-linecap: round; }
  .g-needle circle { fill: var(--text); } .g-needle .g-cap { fill: var(--err); }
  .g-needle { filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .g-svg .g-val { fill: var(--text); font: 700 25px var(--mono); text-anchor: middle; }
  .g-unit { fill: var(--muted); font-size: 13px; text-anchor: middle; }
  .g-big { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 12px; }
  .g-big .g-val { font: 700 38px/1 var(--mono); letter-spacing: -.02em; transition: color .3s; }
  .g-big small { font-size: 14px; color: var(--muted); }
  .g-bar { position: relative; height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .gt-number .g-bar { height: 4px; }
  /* заполнение анимируется через transform — плавнее на слабых телефонах */
  .g-fill { height: 100%; width: 100%; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, var(--blue), #6fd3ff); }
  .g-mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--err); }
  .g-range { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); margin-top: 6px; }
  .gauge.warn { border-color: rgba(217,58,53,.6); }
  .gauge.warn::after { content: ''; position: absolute; inset: -1px; border-radius: 14px; border: 2px solid var(--err); pointer-events: none; animation: gPulse 1.1s ease-in-out infinite; }
  .gauge.warn .g-big .g-val { color: var(--err); }
  .gauge.warn .g-svg .g-val { fill: var(--err); }
  .gauge.warn .g-fill { background: linear-gradient(90deg, #f39b1f, var(--err)); }
  @keyframes gIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes gPulse { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .gauge, .gauge.warn::after { animation: none; } }
  .dash-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

function loadMap() { try { return JSON.parse(localStorage.getItem(MAP_KEY)) || {}; } catch { return {}; } }
function saveMap(m) { try { localStorage.setItem(MAP_KEY, JSON.stringify(m)); } catch {} }
function lookup(ecu, code) {
  if (mode === 'demo' && DEMO_MAP[code]) return { num: DEMO_MAP[code], ...DTC_DB[DEMO_MAP[code]] };

  if (!m) return null;
  if (m.ref && DTC_DB[m.ref]) return { num: m.ref, ...DTC_DB[m.ref] };
  return { plain: m.text, official: '', fix: [], custom: true };

// ===================== Транспорт: общая часть (буфер приёма, эхо, разбор ответа) =====================
class ByteTransport {
  constructor() { this.buf = []; this.waiters = []; }
  push(bytes) {
    for (const b of bytes) this.buf.push(b);
    this.waiters.forEach(w => w());
  }
  waitBytes(n, timeout) {
    return new Promise((resolve, reject) => {
      if (this.buf.length >= n) return resolve();
      const check = () => { if (this.buf.length >= n) { done(); resolve(); } };
      const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, timeout);
      const done = () => { clearTimeout(timer); this.waiters = this.waiters.filter(w => w !== check); };
      this.waiters.push(check);
    });
  }
  async request(msg, timeout = 1000) {
    this.buf = [];
    await this.send(new Uint8Array(msg));
    // KKL-кабели возвращают эхо отправленных байт — убираем его
    try {
      await this.waitBytes(msg.length, 300);
      if (this.buf.slice(0, msg.length).every((b, i) => b === msg[i])) this.buf.splice(0, msg.length);
    } catch { /* эха нет */ }
    await this.waitBytes(2, timeout);
    const len = this.buf[1];
    if (len < 3) throw new Error('некорректная длина ответа');
    await this.waitBytes(len, timeout);
    return this.buf.splice(0, len);
  }
}

// ===================== Транспорт: кабель через Web Serial (Windows / macOS / Linux) =====================
class SerialTransport extends ByteTransport {
  get label() { return 'USB K-line (KKL / K+DCAN)'; }
  async open() {
    if (!('serial' in navigator)) throw new Error('Браузер не поддерживает Web Serial. Откройте страницу в Chrome или Edge.');
    this.port = await navigator.serial.requestPort();
    await this.port.open({ baudRate: 9600, dataBits: 8, parity: 'even', stopBits: 1, bufferSize: 4096 });
    this.writer = this.port.writable.getWriter();
    this.readLoop();
  }
  async readLoop() {
    this.reader = this.port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await this.reader.read();
        if (done) break;
        this.push(value);
      }
    } catch (e) { log('er', 'Ошибка чтения порта: ' + e.message); }
    finally { this.reader.releaseLock(); }
  }
  send(data) { return this.writer.write(data); }
  async close() {
    try { await this.reader?.cancel(); } catch {}
    try { this.writer?.releaseLock(); } catch {}
    try { await this.port?.close(); } catch {}
  }
}

// ===================== Транспорт: кабель FTDI через WebUSB (Android) =====================
// Приложение само настраивает чип FTDI управляющими запросами, как это делает драйвер на компьютере.
const FTDI = {
  VID: 0x0403,
  RESET: 0x00, MODEM_CTRL: 0x01, FLOW_CTRL: 0x02, BAUDRATE: 0x03, DATA: 0x04, LATENCY: 0x09,
  BAUD_9600: 0x4138,                    // делитель 312,5 от 3 МГц
  DATA_8E1: 0x0008 | (2 << 8),          // 8 бит, чётность even, 1 стоп-бит
  DTR_RTS_ON: 0x0303,
};
class UsbFtdiTransport extends ByteTransport {
  get label() { return 'USB FTDI (WebUSB, Android)'; }
  async open() {
    if (!('usb' in navigator)) throw new Error('Браузер не поддерживает WebUSB. Откройте страницу в Chrome на Android.');
    this.dev = await navigator.usb.requestDevice({ filters: [{ vendorId: FTDI.VID }] });
    await this.dev.open();
    if (!this.dev.configuration) await this.dev.selectConfiguration(1);
    const iface = this.dev.configuration.interfaces[0];
    try { await this.dev.claimInterface(iface.interfaceNumber); }
    catch (e) {
      throw new Error('Не удалось захватить кабель. На компьютере его занимает драйвер — там используйте обычное подключение. (' + e.message + ')');
    }
    const eps = iface.alternate.endpoints;
    this.epIn = eps.find(e => e.direction === 'in' && e.type === 'bulk');
    this.epOut = eps.find(e => e.direction === 'out' && e.type === 'bulk');
    if (!this.epIn || !this.epOut) throw new Error('У устройства нет нужных каналов обмена — похоже, это не кабель FTDI.');
    this.index = iface.interfaceNumber + 1;   // порт A
    await this.ctrl(FTDI.RESET, 0);
    await this.ctrl(FTDI.BAUDRATE, FTDI.BAUD_9600, 0);
    await this.ctrl(FTDI.DATA, FTDI.DATA_8E1);
    await this.ctrl(FTDI.FLOW_CTRL, 0);
    await this.ctrl(FTDI.MODEM_CTRL, FTDI.DTR_RTS_ON);
    await this.ctrl(FTDI.LATENCY, 2);          // быстрее отдавать ответ (по умолчанию 16 мс)
    this.closed = false;
    this.onDisc = e => { if (e.device === this.dev) { this.closed = true; log('er', 'Кабель отключён от телефона.'); } };
    navigator.usb.addEventListener('disconnect', this.onDisc);
    this.readLoop();
  }
  async ctrl(request, value, index = this.index) {
    const r = await this.dev.controlTransferOut({ requestType: 'vendor', recipient: 'device', request, value, index });
    if (r.status !== 'ok') throw new Error('FTDI: ошибка настройки (запрос ' + request + ')');
  }
  async readLoop() {
    const size = this.epIn.packetSize || 64;
    while (!this.closed) {
      try {
        const r = await this.dev.transferIn(this.epIn.endpointNumber, size);
        if (r.status === 'stall') { await this.dev.clearHalt('in', this.epIn.endpointNumber); continue; }
        const d = r.data;
        // FTDI добавляет 2 байта статуса в начало каждого пакета по 64 байта
        for (let off = 0; d && off < d.byteLength; off += size) {
          const end = Math.min(off + size, d.byteLength);
          if (end - off > 2) this.push(new Uint8Array(d.buffer, d.byteOffset + off + 2, end - off - 2));
        }
      } catch (e) {
        if (!this.closed) log('er', 'Ошибка чтения USB: ' + e.message);
        break;
      }
    }
  }
  async send(data) {
    const r = await this.dev.transferOut(this.epOut.endpointNumber, data);
    if (r.status !== 'ok') throw new Error('FTDI: ошибка отправки');
  }
  async close() {
    this.closed = true;
    navigator.usb?.removeEventListener('disconnect', this.onDisc);
    try { await this.dev?.releaseInterface(this.dev.configuration.interfaces[0].interfaceNumber); } catch {}
    try { await this.dev?.close(); } catch {}
  }
}

// ===================== Транспорт: демо (выдуманные ответы) =====================
class DemoTransport {
  async open() {} async close() {}
  async request(msg) {
    await sleep(110);
    const [addr, , cmd, sub] = msg;
    if (![0x12, 0x32, 0x56, 0x80].includes(addr)) throw new Error('timeout');
    const reply = data => { const m = [addr, data.length + 3, ...data]; m.push(xor(m)); return m; };
    const enc = s => Array.from(s, c => c.charCodeAt(0));
    if (cmd === 0x00) return reply([0xA0, ...enc('1730574'), ...enc('0213'), 0x05, 0x91, 0x23]);
    if (cmd === 0x04) return reply(addr === 0x12 ? [0xA0, 0x02, 0x1F, 0x03, 0x00, 0x2A, 0x01, 0x00] : [0xA0, 0x00]);
    if (cmd === 0x05) return reply([0xA0]);
    if (cmd === 0x0B && sub === 0x03) {
      // Имитация: периодические «перегазовки», прогрев двигателя, бортсеть ~14 В
      this.t0 ??= Date.now();
      const t = (Date.now() - this.t0) / 1000;
      const thr = Math.max(0, Math.sin(t / 1.6)) ** 3;
      const rpm = Math.round(780 + thr * 5600 + Math.random() * 30);
      const temp = Math.round(Math.min(90, 45 + t * 1.5)) + 2;
      return reply([0xA0, rpm >> 8, rpm & 0xFF, temp, Math.round(thr * 250),
        138 + Math.round(Math.random() * 3), Math.round(25 + thr * 60), 0x00, 0x7F]);
    }
    return reply([0xFF]);
  }
}

// ===================== Протокол DS2 =====================
let transport = null, mode = null, queue = Promise.resolve();
const frame = (addr, data) => { const m = [addr, data.length + 3, ...data]; m.push(xor(m)); return m; };

function ds2(msg, timeout) {
  const job = queue.then(async () => {
    log('tx', '→ ' + hex(msg));
    try {
      const resp = await transport.request(msg, timeout);
      const ok = xor(resp) === 0;
      log(ok ? 'rx' : 'er', '← ' + hex(resp) + (ok ? '' : '   (неверная контрольная сумма)'));
      if (!ok) throw new Error('неверная контрольная сумма');
      return resp;
    } catch (e) { log('er', '✕ ' + (e.message === 'timeout' ? 'нет ответа' : e.message)); throw e; }
  });
  queue = job.catch(() => {});
  return job;
}
async function cmd(addr, data, timeout) {
  const r = await ds2(frame(addr, data), timeout);
  return { code: r[2], status: RESP[r[2]] || 'Код ' + h1(r[2]), data: r.slice(3, -1) };
}
const errText = e => e.message === 'timeout' ? 'Блок не ответил. Проверьте зажигание, переходник и перемычку 7–8.' : e.message;

// ===================== Подписи значений потока данных =====================
// Для каждого блока (по номеру детали) хранится список: какой байт что означает и как пересчитать.
const PARAMS_KEY = 'ds2-params';
const DEMO_PARAMS = [
  { name: 'Обороты двигателя', off: 0, len: 2, f: 'x', unit: 'об/мин', min: 0, max: 7000, warn: 6000, dec: 0, type: 'dial' },
  { name: 'Температура ОЖ', off: 2, len: 1, f: 'x-2', unit: '°C', min: 0, max: 130, warn: 110, dec: 0, type: 'dial' },
  { name: 'Дроссельная заслонка', off: 3, len: 1, f: 'x*0.4', unit: '%', min: 0, max: 100, warn: null, dec: 0, type: 'bar' },
  { name: 'Напряжение бортсети', off: 4, len: 1, f: 'x*0.1', unit: 'В', min: 10, max: 16, warn: 15, dec: 1, type: 'number' },
  { name: 'Время впрыска', off: 5, len: 1, f: 'x*0.1', unit: 'мс', min: 0, max: 10, warn: null, dec: 1, type: 'dial' },
];
const FORMULA_RE = /^[\dx+\-*/().\s]+$/;
function compileFormula(f) {
  if (!FORMULA_RE.test(f)) throw new Error('В формуле можно использовать только x, цифры, + − * / ( ) и точку');
  const fn = new Function('x', 'return (' + f + ')');
  if (!Number.isFinite(fn(1))) throw new Error('Формула не даёт число');
  return fn;
}
const fnCache = new Map();
function evalParam(q, d) {
  if (!d || q.off + q.len > d.length) return null;
  const raw = q.len === 2 ? (d[q.off] << 8 | d[q.off + 1]) : d[q.off];
  let fn = fnCache.get(q.f);
  if (!fn) { try { fn = compileFormula(q.f); } catch { fn = () => NaN; } fnCache.set(q.f, fn); }
  const v = fn(raw);
  return { raw, v: Number.isFinite(v) ? v : null };
}
const fmt = (v, dec = 0) => v == null || !Number.isFinite(v) ? '—'
  : v.toLocaleString('ru-RU', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const clamp01 = x => Math.max(0, Math.min(1, x));

function sanitizeParam(q) {
  if (!q || typeof q !== 'object') return null;
  const f = String(q.f ?? 'x').trim() || 'x';
  if (!FORMULA_RE.test(f)) return null;
  const num = (v, d) => (v === '' || v == null || !Number.isFinite(+v)) ? d : +v;
  const min = num(q.min, 0), max = num(q.max, 100);
  return {
    name: String(q.name ?? '').trim().slice(0, 40),
    off: Math.max(0, Math.min(255, Math.trunc(num(q.off, 0)))),
    len: +q.len === 2 ? 2 : 1, f,
    unit: String(q.unit ?? '').trim().slice(0, 12),
    min, max: max > min ? max : min + 1,
    warn: num(q.warn, null),
    dec: Math.max(0, Math.min(3, Math.trunc(num(q.dec, 0)))),
    type: ['dial', 'bar', 'number'].includes(q.type) ? q.type : 'dial',
  };
}
function loadParams() { try { return JSON.parse(localStorage.getItem(PARAMS_KEY)) || {}; } catch { return {}; } }
function saveParams(m) { try { localStorage.setItem(PARAMS_KEY, JSON.stringify(m)); } catch {} }
function getParams(ecu) {
  const m = loadParams();
  if (Array.isArray(m[ecu])) return m[ecu].map(sanitizeParam).filter(Boolean);
  return ecu === 'demo' ? DEMO_PARAMS.map(x => ({ ...x })) : [];
}
function setParams(ecu, list) { const m = loadParams(); m[ecu] = list; saveParams(m); }

// Номер детали блока — ключ, под которым хранятся подписи и привязки кодов
async function ensureEcu(p) {
  if (p.ecu) return p.ecu;
  if (mode === 'demo') return (p.ecu = 'demo');
  let part = null;
  try { const id = await cmd(p.addr, [0x00]); if (id.code === 0xA0) part = ascii(id.data.slice(0, 7)); } catch {}
  return (p.ecu = part && /^\d{7}$/.test(part) ? part : 'A' + h1(p.addr));
}

// ===================== Навигация =====================
// Экраны лежат в стеке. Каждый переход записывается в историю браузера,
// поэтому системная кнопка «Назад» (Android, браузер) возвращает на предыдущий экран.
const state = { stack: [], scan: {}, module: null, poll: null, gauges: [], raf: 0 };
const OFFLINE_SCREENS = new Set(['dtcref', 'help', 'log', 'polo', 'polohelp', 'polodtcref']);   // открываются по ссылке и без подключения
const hashFor = stack => '#/' + stack.slice(1).map(s => s.screen + (s.params.addr != null ? '-' + h1(s.params.addr).toLowerCase() : '')).join('/');
function go(screen, params = {}, replace = false) {
  stopPoll();
  if (replace) state.stack.pop();
  state.stack.push({ screen, params });
  const st = { depth: state.stack.length - 1 };
  try { replace ? history.replaceState(st, '', hashFor(state.stack)) : history.pushState(st, '', hashFor(state.stack)); } catch {}
  render(true);
}
function back() { if (state.stack.length > 1) history.back(); }
function home() { const n = state.stack.length - 1; if (n > 0) history.go(-n); }
const cur = () => state.stack.at(-1);
window.addEventListener('popstate', e => {
  // «Назад» при открытом окне — просто закрыть окно
  if (modalState.open) {
    modalState.cancel();
    try { history.pushState({ depth: state.stack.length - 1 }, '', hashFor(state.stack)); } catch {}
    return;
  }
  const d = e.state?.depth ?? 0;
  if (d < state.stack.length - 1) { stopPoll(); state.stack.length = Math.max(1, d + 1); render(true); }
  else if (d > state.stack.length - 1) history.go(state.stack.length - 1 - d);   // «вперёд» не поддерживается
});

function render(moveFocus = false) {
  const { screen, params } = cur();
  state.gauges = [];
  // путь
  const crumbs = $('crumbs');
  crumbs.innerHTML = '';
  state.stack.forEach((s, i) => {
    if (i) { const sep = document.createElement('i'); sep.textContent = '›'; sep.setAttribute('aria-hidden', 'true'); crumbs.appendChild(sep); }
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'crumb'; b.textContent = SCREENS[s.screen].crumb(s.params);
    if (i === state.stack.length - 1) b.setAttribute('aria-current', 'page');
    else b.onclick = () => history.go(i - (state.stack.length - 1));
    crumbs.appendChild(b);
  });
  const v = $('view');
  v.innerHTML = '';
  SCREENS[screen].draw(v, params);
  const t = v.querySelector('.title');
  if (t) { t.setAttribute('role', 'heading'); t.setAttribute('aria-level', '1'); }
  drawBar(SCREENS[screen].buttons ? SCREENS[screen].buttons(params) : []);
  document.title = (screen === 'home' ? '' : SCREENS[screen].crumb(params) + ' · ') + 'BMW DS2 Диагностика';
  $('logBtn').setAttribute('aria-pressed', String(screen === 'log'));
  refreshVci();
  if (moveFocus) { document.querySelector('.screen').scrollTop = 0; v.focus({ preventScroll: true }); }
}

function drawBar(extra) {
  const bar = $('bottombar');
  bar.innerHTML = '';
  const add = (b) => {
    const el = document.createElement('button');
    el.type = 'button';
    el.innerHTML = ICON[b.icon] + `<span>${b.label}</span>`;
    if (b.cls) el.className = b.cls;
    el.disabled = !!b.disabled;
    if (b.id) el.id = b.id;
    el.onclick = async () => {
      const r = b.onClick();

  add({ icon: 'home', label: 'Главная', onClick: home, disabled: !deep });

function tile(icon, color, name, desc, onClick, needsConnection) {

  // Недоступная плитка не молчит, а объясняет, почему
  if (needsConnection) { d.setAttribute('aria-disabled', 'true'); d.onclick = () => (typeof needsConnection === 'function' ? needsConnection() : needConn()); }

// Строка таблицы, которую можно нажать мышью, пальцем или клавишами Enter/пробел
function clickable(el, fn, label) {
  el.classList.add('click');
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  if (label) el.setAttribute('aria-label', label);
  el.onclick = fn;
  el.onkeydown = e => { if (e.target === el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); fn(); } };
}
function h(html) { const t = document.createElement('div'); t.innerHTML = html.trim(); return t.firstElementChild; }
function announce(msg) { const a = $('announcer'); a.textContent = ''; setTimeout(() => { a.textContent = msg; }, 60); }

// Окно: закрывается Esc, кнопкой «Назад» и нажатием на затемнение; фокус не уходит за его пределы
const modalState = { open: false, cancel: null };
function modal(title, text, buttons) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    const cancelVal = buttons[0][1];
    let onKey;
    const finish = val => {
      if (!modalState.open) return;
      modalState.open = false;
      $('modal').classList.remove('show');
      document.removeEventListener('keydown', onKey, true);
      if (prev && prev.isConnected && !$('modal').contains(prev)) prev.focus({ preventScroll: true });
      resolve(val);
    };
    $('mTitle').textContent = title; $('mText').innerHTML = text;
    $('mBtns').innerHTML = '';
    let primary = null;
    buttons.forEach(([label, val, pri]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label;
      if (pri) { b.className = 'pri'; primary = b; }
      if (val === 'del') b.className = 'danger';
      b.onclick = () => finish(val);
      $('mBtns').appendChild(b);
    });
    onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); finish(cancelVal); }
      else if (e.key === 'Tab') {
        const f = [...$('modal').querySelectorAll('button, input, select, textarea')].filter(x => !x.disabled);
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
        else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
      }
    };
    document.addEventListener('keydown', onKey, true);
    $('modal').onclick = e => { if (e.target === $('modal')) finish(cancelVal); };
    modalState.open = true;
    modalState.cancel = () => finish(cancelVal);
    $('modal').classList.add('show');
    const firstField = $('mText').querySelector('input, select');
    (firstField || primary || $('mBtns').querySelector('button')).focus({ preventScroll: true });
  });
}

function setVci(m) { mode = m; refreshVci(); }
// Индикатор и строка автомобиля показывают тот раздел (BMW или VW), в котором вы сейчас находитесь
function refreshVci() {
  const isPolo = !!cur()?.screen?.startsWith('polo');
  const m = isPolo ? elmMode : mode;
  const tr = isPolo ? elm : transport;
  $('vci').className = 'vci' + (m === 'demo' ? ' demo' : m ? ' on' : '');
  $('vciText').textContent = m === 'demo' ? 'Демо-режим' : m ? 'Адаптер подключён' : 'Адаптер не подключён';
  $('vciShort').textContent = m === 'demo' ? 'Демо' : m ? 'Связь' : 'Нет связи';
  $('vehCar').textContent = isPolo ? 'VW Polo 2013' : 'BMW E30 / E34';
  $('vehProto').textContent = isPolo ? (polo.proto || 'OBD2 · CAN 500 кбит/с') : 'DS2 · K-line · 9600 8E1';
  $('vehAdapter').textContent = m === 'demo' ? 'демо (данные выдуманы)' : m ? tr.label : '—';
}
async function connect(kind) {
  try {
    transport = kind === 'demo' ? new DemoTransport() : kind === 'usb' ? new UsbFtdiTransport() : new SerialTransport();
    await transport.open();
    setVci(kind);
    log('inf', kind === 'demo' ? 'Демо-режим: ответы генерируются, машина не нужна.'
      : kind === 'usb' ? 'Кабель FTDI настроен через WebUSB: 9600 бод, 8E1.' : 'Порт открыт: 9600 бод, 8E1.');
    announce(kind === 'demo' ? 'Включён демо-режим' : 'Адаптер подключён');
  } catch (e) {
    try { await transport?.close(); } catch {}
    transport = null;
    if (e.name !== 'NotFoundError') modal('Ошибка подключения', esc(e.message), [['OK', 0, 1]]);
  }
  render();
}
async function disconnect() {
  stopPoll(); await transport?.close(); transport = null; setVci(null); state.scan = {};
  log('inf', 'Отключено.'); announce('Адаптер отключён');
  if (state.stack.length > 1) home(); else render();
}

async function loadInto(v, p, data, view) {
  const box = h('<div class="card"><div class="empty">Чтение данных…</div></div>');
  v.appendChild(box);
  try {
    const r = await cmd(p.addr, data);
    if (cur().params !== p) return;
    if (r.code !== 0xA0) { box.innerHTML = `<div class="empty"><span class="badge b-warn">${esc(r.status)}</span></div>`; return; }
    box.replaceWith(view(r.data));
  } catch (e) {
    if (cur().params !== p) return;
    box.innerHTML = `<div class="empty"><span class="badge b-err">Нет связи</span><p>${esc(errText(e))}</p></div>`;
  }
}

// --- Ошибки: чтение, разбор, расшифровка ---
async function loadFaults(v, p) {
  const box = h('<div class="card"><div class="empty">Чтение памяти неисправностей…</div></div>');
  v.appendChild(box);
  try {
    // Номер детали нужен, чтобы привязки кодов не путались между разными блоками
    let part = null;
    try { const id = await cmd(p.addr, [0x00]); if (id.code === 0xA0) part = ascii(id.data.slice(0, 7)); } catch {}
    const r = await cmd(p.addr, [0x04]);
    if (cur().params !== p) return;
    if (r.code !== 0xA0) { box.innerHTML = `<div class="empty"><span class="badge b-warn">${esc(r.status)}</span></div>`; return; }
    const ecu = part && /^\d{7}$/.test(part) ? part : 'A' + h1(p.addr);
    box.replaceWith(faultView(p, r.data, ecu));
  } catch (e) {
    if (cur().params !== p) return;
    box.innerHTML = `<div class="empty"><span class="badge b-err">Нет связи</span><p>${esc(errText(e))}</p></div>`;
  }
}

// Предварительный разбор: [кол-во, записи по N байт] — иначе каждый ненулевой байт считается кодом
function parseFaults(d) {
  if (!d.length || d.every(b => !b)) return [];
  const n = d[0], rest = d.length - 1;
  if (n > 0 && rest >= n && rest % n === 0) {
    const k = rest / n, out = [];
    for (let i = 0; i < n; i++) { const e = d.slice(1 + i * k, 1 + (i + 1) * k); out.push({ code: e[0], raw: e }); }
    return out;
  }
  return d.filter(b => b).map(b => ({ code: b, raw: [b] }));
}

function dtcCard(codeHtml, info, meta, unknown) {
  const el = h(`<div class="dtc">
    <div class="dtc-code${unknown ? ' unk' : ''}">${codeHtml}</div>
    <div>
      <div class="dtc-plain">${esc(info.plain)}${info.official ? ` <span class="dtc-off">(${esc(info.official)})</span>` : ''}</div>
      ${meta ? `<div class="dtc-meta">${meta}</div>` : ''}
    </div>
    <div class="act"></div>
    ${info.fix?.length ? `<div class="dtc-fix"><b>Что проверить:</b><ol>${info.fix.map(f => `<li>${esc(f)}</li>`).join('')}</ol></div>` : ''}
  </div>`);
  return el;
}

function faultView(p, d, ecu) {
  const wrap = h('<div></div>');
  const list = parseFaults(d);
  if (!list.length) {
    wrap.appendChild(h('<div class="card big-ok"><div class="n" style="color:var(--ok)">0</div><div class="l">Ошибок не обнаружено</div></div>'));
    return wrap;
  }
  const card = h(`<div class="card"><div class="sumbar"><span>Найдено записей: <b class="n">${list.length}</b></span><span>Блок: <b>${esc(ecu)}</b></span>${mode === 'demo' ? '<span class="badge b-warn">демо: данные выдуманы</span>' : ''}</div></div>`);
  for (const f of list) {
    const info = lookup(ecu, f.code);
    const meta = `код блока ${h1(f.code)} · байты ${hex(f.raw)}`;
    const el = info
      ? dtcCard(info.num ? `${info.num}<small>код ${h1(f.code)}</small>` : h1(f.code), info, meta, !info.num)
      : dtcCard(`${h1(f.code)}<small>нет в базе</small>`, { plain: 'Расшифровка для этого кода блока ещё не задана' }, meta + ' · нажмите «Привязать», чтобы указать, какой это код Motronic', true);
    if (mode !== 'demo') {
      const b = document.createElement('button');
      b.className = 'lnk'; b.textContent = info ? 'Изменить' : 'Привязать';
      b.onclick = () => assignCode(ecu, f.code, () => go('faults', p, true));
      el.querySelector('.act').appendChild(b);
    }
    card.appendChild(el);
  }
  wrap.appendChild(card);
  wrap.appendChild(h(`<div class="hint">Разбор ответа блока — предварительный: у каждой модели блока (M1.3, M1.7, M3.1…) своя нумерация внутренних кодов.
    Чтобы получить расшифровку, привяжите код блока к официальному 4-значному коду BMW. Его можно узнать миганием лампы Check Engine
    (см. «Справочник кодов») или по программе INPA. Привязка запоминается в этом браузере.</div>`));
  return wrap;
}

async function assignCode(ecu, code, done) {
  const map = loadMap(), key = ecu + ':' + code, curv = map[key];
  const ok = await modal('Привязка кода ' + h1(code),
    `Блок <b>${esc(ecu)}</b>, внутренний код <b>${h1(code)}</b>.<br><br>
     Введите 4-значный код Motronic (например <b>1222</b>) или своё описание. Пустое поле — удалить привязку.<br><br>
     <input class="field" id="mapIn" style="width:100%" value="${esc(curv ? (curv.ref || curv.text) : '')}">
     <div id="mapHint" style="font-size:12px;color:var(--muted);margin-top:6px"></div>`,
    [['Отмена', false], ['Сохранить', true, 1]]);
  if (!ok) return;
  const val = $('mapIn').value.trim();
  if (!val) delete map[key];
  else if (DTC_DB[val]) map[key] = { ref: val };
  else map[key] = { text: val };
  saveMap(map);
  log('inf', `Привязка ${key} → ${val || '(удалена)'}`);
  done();
}

async function clearFaults(addr) {
  if (state.clearing) return;      // защита от повторного нажатия
  state.clearing = true;
  try {
    const m = MODULES.find(x => x.addr === addr);
    const ok = await modal('Стирание кодов', `Стереть память неисправностей в блоке <b>${m.short}</b>?<br><br>Двигатель должен быть заглушен, зажигание включено.`, [['Отмена', false], ['Стереть', true, 1]]);
    if (!ok) return;
    try {
      const r = await cmd(addr, [0x05]);
      if (r.code === 0xA0) announce('Память неисправностей очищена');
      await modal('Стирание кодов', r.code === 0xA0 ? 'Память неисправностей очищена. Прочитайте коды ещё раз, чтобы проверить.' : 'Блок ответил: ' + esc(r.status), [['OK', 0, 1]]);
    } catch (e) { await modal('Стирание кодов', esc(errText(e)) + '<br><br>Проверьте подключение и попробуйте ещё раз.', [['OK', 0, 1]]); }
    if (cur().screen === 'faults') go('faults', cur().params, true);
  } finally { state.clearing = false; }
}

async function runScan(rows, p) {
  const results = p.results = {};
  let i = 0;
  for (const m of MODULES) {
    // Опрос принадлежит своему экрану: ушли с него или запустили заново — этот цикл останавливается
    if (cur().params !== p) return;
    rows[m.addr].cells[2].innerHTML = '<span class="badge b-run">Опрос…</span>';
    try {
      await cmd(m.addr, [0x00], 600);
      results[m.addr] = { ok: true };
      try {
        const f = await cmd(m.addr, [0x04], 800);
        results[m.addr].faults = f.code === 0xA0 ? (f.data.some(b => b) ? 'есть' : 'нет') : '?';
      } catch { results[m.addr].faults = '?'; }
    } catch { results[m.addr] = { ok: false }; }
    state.scan[m.addr] = results[m.addr].ok;
    if (cur().params !== p) return;
    fillScan(rows, results);
    $('scanBar').style.transform = `scaleX(${++i / MODULES.length})`;
  }
  const found = Object.values(results).filter(r => r.ok).length;
  const withF = Object.values(results).filter(r => r.faults === 'есть').length;
  p.done = true;
  p.summary = `завершён: найдено блоков ${found}, с ошибками ${withF}`;
  $('scanState').textContent = p.summary;
  announce(`Автоскан ${p.summary}`);
  log('inf', `Автоскан: найдено ${found} из ${MODULES.length}.`);
}
function fillScan(rows, results) {
  for (const [addr, r] of Object.entries(results)) {
    const tr = rows[addr];
    tr.cells[2].innerHTML = r.ok ? '<span class="badge b-ok">Найден</span>' : '<span class="badge b-err">Нет ответа</span>';
    tr.cells[3].innerHTML = !r.ok ? '' : r.faults === 'есть' ? '<span class="badge b-warn">Есть ошибки</span>' : r.faults === 'нет' ? '<span class="badge b-ok">Нет ошибок</span>' : '<span class="badge b-wait">—</span>';
    if (r.ok && !tr.classList.contains('click')) clickable(tr, () => go('module', { addr: +addr }), MODULES.find(m => m.addr === +addr).name);
  }
}

// --- Поток данных ---
function stopPoll() {
  if (state.poll) { state.poll.stop = true; state.poll = null; }
  const s = $('liveState'); if (s) s.textContent = 'остановлен';
  syncPollButtons();
}
// «Старт» недоступен, пока идёт опрос; «Стоп» — пока опроса нет
function syncPollButtons() {
  const a = $('bStart'), b = $('bStop');
  if (a) a.disabled = !!state.poll;
  if (b) b.disabled = !state.poll;
}
const setLiveState = t => { const s = $('liveState'); if (s) s.textContent = t; };
async function startPoll(p, onData) {
  if (state.poll) return;
  const job = { stop: false }; state.poll = job;
  syncPollButtons();
  setLiveState('идёт опрос…');
  await ensureEcu(p);
  while (!job.stop) {
    try {
      const r = await cmd(p.addr, [0x0B, 0x03]);
      if (job.stop) break;
      if (r.code !== 0xA0) { setLiveState(r.status); stopPoll(); break; }
      p.last = r.data;
      onData(r.data);
    } catch (e) { if (!job.stop) { stopPoll(); setLiveState(errText(e)); } break; }
    await sleep(200);
  }
}
const liveFeed = p => d => drawLive(p, d);
const dashFeed = p => d => { for (const g of state.gauges) { const r = evalParam(g.p, d); if (r) g.set(r.v); } };
// Переход между «Потоком данных» и «Приборами» без разрастания пути
function switchTo(screen, p) {
  if (state.stack.at(-2)?.screen === screen) back(); else go(screen, p);
}

function drawLive(p, d, record = true) {
  if (p.hist == null) p.hist = {};
  if (record) d.forEach((b, i) => { (p.hist[i] ??= []).push(b); if (p.hist[i].length > 120) p.hist[i].shift(); });
  const tb = $('liveBody'); if (!tb) return;
  const params = getParams(p.ecu);
  // Строки создаются один раз, дальше обновляются только ячейки — чтобы кнопки не «убегали» из-под пальца
  if (tb.dataset.n !== String(d.length)) {
    tb.innerHTML = '';
    d.forEach((_, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="mono">${i}</td><td class="mono"></td><td class="mono"></td><td class="pc"></td><td><button class="pen" type="button" title="Подписать значение" aria-label="Подписать байт ${i}">${ICON.edit}</button></td>`;
      clickable(tr, () => { p.sel = i; drawLive(p, p.last, false); }, `Байт ${i}: показать график`);
      tr.querySelector('.pen').onclick = e => { e.stopPropagation(); editParam(p, i); };
      tb.appendChild(tr);
    });
    tb.dataset.n = String(d.length);
  }
  d.forEach((b, i) => {
    const tr = tb.rows[i];
    tr.classList.toggle('sel', i === p.sel);
    tr.cells[1].textContent = h1(b);
    tr.cells[2].textContent = b;
    const q = params.find(x => x.off === i);
    let html;
    if (q) { const r = evalParam(q, d); html = `<b>${esc(q.name)}</b> <span class="mono pv">${fmt(r?.v, q.dec)} ${esc(q.unit)}</span>`; }
    else if (params.some(x => x.len === 2 && x.off === i - 1)) html = `<span class="pc-none">часть значения байта ${i - 1}</span>`;
    else html = '<span class="pc-none">—</span>';
    if (tr.cells[3].innerHTML !== html) tr.cells[3].innerHTML = html;
  });
  drawGraph(p);
}

// Редактор подписи значения
async function editParam(p, off, draft) {
  const list = getParams(p.ecu);
  const ex = list.find(q => q.off === off);
  const q = draft || ex || { name: '', off, len: 1, f: 'x', unit: '', min: 0, max: 255, warn: null, dec: 0, type: 'dial' };
  const html = `<div class="pform">
    <label class="wide">Название<input id="pfName" class="field" value="${esc(q.name)}" placeholder="Например: Обороты двигателя" maxlength="40"></label>
    <label>Номер байта<input id="pfOff" class="field" type="number" min="0" max="255" value="${q.off}"></label>
    <label>Размер<select id="pfLen" class="field"><option value="1">1 байт</option><option value="2">2 байта (старший первым)</option></select></label>
    <label class="wide">Формула пересчёта (x — сырое значение)<input id="pfF" class="field" value="${esc(q.f)}" placeholder="например x*0.1 или x-48"></label>
    <label>Единица<input id="pfUnit" class="field" value="${esc(q.unit)}" placeholder="об/мин, °C, В" maxlength="12"></label>
    <label>Знаков после запятой<input id="pfDec" class="field" type="number" min="0" max="3" value="${q.dec}"></label>
    <label>Начало шкалы<input id="pfMin" class="field" type="number" step="any" value="${q.min}"></label>
    <label>Конец шкалы<input id="pfMax" class="field" type="number" step="any" value="${q.max}"></label>
    <label>Предупреждение от<input id="pfWarn" class="field" type="number" step="any" value="${q.warn ?? ''}" placeholder="не нужно"></label>
    <label>Вид прибора<select id="pfType" class="field"><option value="dial">Стрелочный</option><option value="bar">Шкала</option><option value="number">Цифры</option></select></label>
    <div class="wide pf-prev" id="pfPrev"></div>
  </div>`;
  const btns = [['Отмена', 0]];
  if (ex) btns.push(['Удалить', 'del']);
  btns.push(['Сохранить', 'save', 1]);
  const pr = modal(ex ? 'Изменить подпись' : 'Подписать значение', html, btns);
  $('pfLen').value = String(q.len); $('pfType').value = q.type;
  const read = () => ({
    name: $('pfName').value.trim(), off: +$('pfOff').value, len: +$('pfLen').value, f: $('pfF').value.trim() || 'x',
    unit: $('pfUnit').value.trim(), dec: +$('pfDec').value, min: +$('pfMin').value, max: +$('pfMax').value,
    warn: $('pfWarn').value === '' ? null : +$('pfWarn').value, type: $('pfType').value,
  });
  const preview = () => {
    try {
      const t = read(), fn = compileFormula(t.f), d = p.last || [];
      if (t.off + t.len > d.length) { $('pfPrev').textContent = 'Нет данных для этого байта — запустите опрос.'; return; }
      const raw = t.len === 2 ? (d[t.off] << 8 | d[t.off + 1]) : d[t.off];
      $('pfPrev').innerHTML = `Сейчас: сырое значение <b>${raw}</b> → <b>${fmt(fn(raw), t.dec)} ${esc(t.unit)}</b>`;
    } catch (e) { $('pfPrev').innerHTML = `<span style="color:var(--err)">${esc(e.message)}</span>`; }
  };
  document.querySelectorAll('.pform .field').forEach(el => el.oninput = preview);
  preview();
  const res = await pr;
  if (!res) return;
  let next = list.filter(x => x.off !== off);
  if (res === 'save') {
    const t = read();
    try {
      compileFormula(t.f);
      if (!t.name) throw new Error('Укажите название.');
      if (!(t.max > t.min)) throw new Error('Конец шкалы должен быть больше начала.');
    } catch (e) {
      await modal('Не сохранено', esc(e.message), [['Исправить', 0, 1]]);
      return editParam(p, off, t);
    }
    const clean = sanitizeParam(t);
    next = next.filter(x => x.off !== clean.off);
    next.push(clean);
    next.sort((a, b) => a.off - b.off);
  }
  setParams(p.ecu, next);
  log('inf', `Подписи блока ${p.ecu}: ${res === 'del' ? 'удалена' : 'сохранена'} подпись байта ${off}.`);
  if (p.last && $('liveBody')) drawLive(p, p.last, false);
}
function drawGraph(p) {
  const c = $('graph'); if (!c) return;
  const data = p.hist[p.sel] || [];
  $('graphHead').innerHTML = `Байт ${p.sel}<b>${data.length ? data.at(-1) : '—'}</b>`;
  const dpr = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  g.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement), cv = n => css.getPropertyValue(n).trim();
  g.strokeStyle = cv('--line'); g.lineWidth = 1;
  for (let y = 0; y <= 4; y++) { g.beginPath(); g.moveTo(0, 10 + y * (H - 20) / 4); g.lineTo(W, 10 + y * (H - 20) / 4); g.stroke(); }
  if (data.length < 2) return;
  let lo = Math.min(...data), hi = Math.max(...data);
  if (hi - lo < 4) { lo -= 2; hi += 2; }
  g.fillStyle = cv('--muted'); g.font = '11px system-ui';
  g.fillText(hi, 4, 20); g.fillText(lo, 4, H - 14);
  g.strokeStyle = cv('--blue'); g.lineWidth = 2; g.beginPath();
  data.forEach((val, i) => {
    const x = W - (data.length - 1 - i) * (W / 119), y = 10 + (1 - (val - lo) / (hi - lo)) * (H - 20);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
}

// ===================== Приборы =====================
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ARC0 = 150, ARC = 240, GR = 78;                 // шкала от 150° до 390° (по часовой), радиус
const polar = (deg, r = GR) => { const a = deg * Math.PI / 180; return [100 + r * Math.cos(a), 100 + r * Math.sin(a)]; };
const arcPath = (a0, a1, r = GR) => {
  const [x0, y0] = polar(a0, r), [x1, y1] = polar(a1, r);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
};
const shortNum = n => Math.abs(n) >= 1000 ? (n / 1000).toFixed(n % 1000 ? 1 : 0).replace('.', ',') + 'k' : String(+n.toFixed(1)).replace('.', ',');
let gaugeId = 0;

class Gauge {
  constructor(q, i) {
    this.p = q; this.span = q.max - q.min;
    this.cur = q.min; this.target = q.min; this.has = false;
    this.t0 = performance.now();
    const el = this.el = document.createElement('div');
    el.className = 'gauge gt-' + q.type;
    el.style.setProperty('--i', i);
    el.setAttribute('role', 'group');
    el.setAttribute('aria-label', q.name + (q.unit ? ', ' + q.unit : ''));
    const warnF = q.warn != null && q.warn < q.max ? clamp01((q.warn - q.min) / this.span) : null;
    // Превышение показывается не только цветом, но и значком с текстом
    const head = `<div class="g-head"><div class="g-name">${esc(q.name)}</div><span class="g-alert"><span class="ico">${ICON.alert}</span>выше нормы</span></div>`;
    if (q.type === 'dial') {
      const id = 'gg' + (++gaugeId);
      this.L = Math.PI * 2 * GR * ARC / 360;
      let ticks = '', labels = '';
      for (let k = 0; k <= 20; k++) {
        const a = ARC0 + ARC * k / 20, major = k % 5 === 0;
        const [x0, y0] = polar(a, GR - 12), [x1, y1] = polar(a, GR - (major ? 22 : 17));
        ticks += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" class="g-tick${major ? ' maj' : ''}"/>`;
      }
      for (let k = 0; k <= 4; k++) {
        const [x, y] = polar(ARC0 + ARC * k / 4, GR - 33);
        labels += `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" class="g-lbl">${shortNum(q.min + this.span * k / 4)}</text>`;
      }
      el.innerHTML = `${head}
        <svg viewBox="0 0 200 168" class="g-svg" aria-hidden="true">
          <defs><linearGradient id="${id}" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--blue)"/><stop offset="1" style="stop-color:#6fd3ff"/></linearGradient></defs>
          <path d="${arcPath(ARC0, ARC0 + ARC)}" class="g-track"/>
          ${warnF != null ? `<path d="${arcPath(ARC0 + ARC * warnF, ARC0 + ARC, GR + 9)}" class="g-warnzone"/>` : ''}
          <path d="${arcPath(ARC0, ARC0 + ARC)}" class="g-arc" stroke="url(#${id})" stroke-dasharray="${this.L.toFixed(2)}" stroke-dashoffset="${this.L.toFixed(2)}"/>
          ${ticks}${labels}
          <g class="g-needle" transform="rotate(${ARC0} 100 100)"><line x1="88" y1="100" x2="${100 + GR - 16}" y2="100"/><circle cx="100" cy="100" r="7"/><circle cx="100" cy="100" r="2.5" class="g-cap"/></g>
          <text x="100" y="146" class="g-val">—</text>
          <text x="100" y="163" class="g-unit">${esc(q.unit)}</text>
        </svg>`;
      this.arc = el.querySelector('.g-arc');
      this.needle = el.querySelector('.g-needle');
    } else {
      el.innerHTML = `${head}
        <div class="g-big"><span class="g-val">—</span><small>${esc(q.unit)}</small></div>
        <div class="g-bar" aria-hidden="true"><div class="g-fill"></div>${warnF != null ? `<i class="g-mark" style="left:${(warnF * 100).toFixed(1)}%"></i>` : ''}</div>
        <div class="g-range"><span>${fmt(q.min, q.dec)}</span><span>${fmt(q.max, q.dec)}</span></div>`;
      this.fill = el.querySelector('.g-fill');
    }
    this.val = el.querySelector('.g-val');
    // Текст для экранного диктора (сама шкала скрыта от него как картинка)
    el.insertAdjacentHTML('beforeend', '<span class="sr-only g-sr"></span>');
    this.sr = el.querySelector('.g-sr');
    this.render();
  }
  set(v) { if (v == null) return; this.target = v; this.has = true; }
  step(now) {
    // Первые ~0,9 с — «прогон» стрелки до максимума и обратно, как на приборке при включении зажигания
    const t = now - this.t0;
    let tgt = this.has ? this.target : this.p.min;
    if (!REDUCED_MOTION && t < 900) tgt = t < 450 ? this.p.max : this.p.min;
    const d = tgt - this.cur;
    this.cur = REDUCED_MOTION || Math.abs(d) < this.span * 0.0005 ? tgt : this.cur + d * (t < 900 ? 0.16 : 0.12);
    this.render(this.has || (!REDUCED_MOTION && t < 1400));
  }
  render(showValue = false) {
    const f = clamp01((this.cur - this.p.min) / this.span);
    // Красный — по тому значению, которое сейчас видно на приборе
    const warn = this.has && this.p.warn != null && this.cur >= this.p.warn;
    this.el.classList.toggle('warn', warn);
    const txt = showValue ? fmt(this.cur, this.p.dec) : '—';
    if (this.val.textContent !== txt) {
      this.val.textContent = txt;
      this.sr.textContent = `${txt} ${this.p.unit}${warn ? ', выше нормы' : ''}`;
    }
    if (this.p.type === 'dial') {
      this.arc.style.strokeDashoffset = (this.L * (1 - f)).toFixed(2);
      this.needle.setAttribute('transform', `rotate(${(ARC0 + ARC * f).toFixed(2)} 100 100)`);
    } else {
      this.fill.style.transform = `scaleX(${f.toFixed(4)})`;
    }
  }
}
function startAnim() {
  if (state.raf) return;
  const loop = now => {
    if (!state.gauges.length) { state.raf = 0; return; }
    for (const g of state.gauges) g.step(now);
    state.raf = requestAnimationFrame(loop);
  };
  state.raf = requestAnimationFrame(loop);
}

// ===================== Экспорт / импорт настроек =====================
// Подписи и привязки кодов хранятся в браузере. Файл позволяет перенести их на телефон или другому человеку.
function exportSettings() {
  const data = { app: 'bmw-ds2', version: 1, saved: new Date().toISOString(), params: loadParams(), dtc: loadMap() };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = 'bmw-ds2-nastroyki.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importSettings() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    try {
      const j = JSON.parse(await inp.files[0].text());
      if (j.app !== 'bmw-ds2') throw new Error('это не файл настроек этого приложения');
      const params = {}, dtc = {};
      for (const [k, arr] of Object.entries(j.params || {})) {
        if (Array.isArray(arr)) params[String(k).slice(0, 32)] = arr.map(sanitizeParam).filter(q => q && q.name);
      }
      for (const [k, v] of Object.entries(j.dtc || {})) {
        if (!/^[\w]{1,32}:\d{1,3}$/.test(k) || !v || typeof v !== 'object') continue;
        if (v.ref && DTC_DB[v.ref]) dtc[k] = { ref: v.ref };
        else if (typeof v.text === 'string') dtc[k] = { text: v.text.slice(0, 120) };
      }
      saveParams({ ...loadParams(), ...params });
      saveMap({ ...loadMap(), ...dtc });
      await modal('Импорт настроек', `Загружено: подписей для блоков — <b>${Object.keys(params).length}</b>, привязок кодов — <b>${Object.keys(dtc).length}</b>.`, [['OK', 0, 1]]);
      render();
    } catch (e) { modal('Импорт настроек', 'Не удалось прочитать файл: ' + esc(e.message), [['OK', 0, 1]]); }
  };
  inp.click();
}

// =====================================================================
// ===================== VW Polo 2013: ELM327 / OBD2 ====================
// =====================================================================
// Polo 2013 работает по стандартному OBD2 через шину CAN (ISO 15765-4, 500 кбит/с).
// Стандарт OBD2 открывает только блок двигателя; ABS, подушки, коробка и т.п. — по протоколу VAG, его здесь нет.

// Транспорт: ELM327 через Web Serial (USB-ELM или Bluetooth-ELM, сопряжённый с компьютером как COM-порт)
class ElmTransport {
  constructor() { this.buf = ''; this.waiters = []; }
  get label() { return (this.version || 'ELM327') + (this.baud ? `, ${this.baud} бод` : ''); }
  async open() {
    if (!('serial' in navigator)) throw new Error('Браузер не поддерживает Web Serial. Откройте страницу в Chrome или Edge на компьютере.');
    this.port = await navigator.serial.requestPort();
    // Скорость у разных ELM327 разная — пробуем по очереди. Для Bluetooth-адаптеров она не важна.
    for (const baud of [38400, 115200, 9600, 57600]) {
      try { await this.port.open({ baudRate: baud, bufferSize: 4096 }); }
      catch (e) { throw new Error('Не удалось открыть порт: ' + e.message); }
      this.writer = this.port.writable.getWriter();
      this.readLoop();
      try {
        const r = await this.raw('ATZ', 2500);
        if (/ELM|OBD/i.test(r)) { this.baud = baud; this.version = (r.match(/ELM327\s*v?[\d.]+/i) || ['ELM327'])[0]; return; }
      } catch {}
      await this.close(true);
    }
    throw new Error('Адаптер ELM327 не ответил. Проверьте, что выбран правильный порт и адаптер вставлен в разъём OBD2 (на Polo — под рулевой колонкой слева).');
  }
  async readLoop() {
    this.reader = this.port.readable.getReader();
    const dec = new TextDecoder();
    try {
      while (true) {
        const { value, done } = await this.reader.read();
        if (done) break;
        this.buf += dec.decode(value, { stream: true });
        this.waiters.forEach(w => w());
      }
    } catch {} finally { try { this.reader.releaseLock(); } catch {} }
  }
  // Ответ ELM327 заканчивается приглашением «>»
  waitPrompt(timeout) {
    return new Promise((resolve, reject) => {
      let timer;
      const done = () => { clearTimeout(timer); this.waiters = this.waiters.filter(w => w !== check); };
      const check = () => {
        const i = this.buf.indexOf('>');
        if (i >= 0) { done(); const out = this.buf.slice(0, i); this.buf = this.buf.slice(i + 1); resolve(out); }
      };
      timer = setTimeout(() => { done(); reject(new Error('timeout')); }, timeout);
      this.waiters.push(check);
      check();
    });
  }
  async raw(text, timeout = 3000) {
    this.buf = '';
    await this.writer.write(new TextEncoder().encode(text + '\r'));
    return this.waitPrompt(timeout);
  }
  async close(keepPort = false) {
    try { await this.reader?.cancel(); } catch {}
    await sleep(30);
    try { this.writer?.releaseLock(); } catch {}
    try { await this.port?.close(); } catch {}
    if (!keepPort) this.port = null;
  }
}

// Демо-адаптер: отвечает как ELM327 на Polo 2013 с двумя ошибками. Все данные выдуманы.
class ElmDemo {
  get label() { return 'демо ELM327 (данные выдуманы)'; }
  async open() { this.t0 = Date.now(); this.cleared = false; this.version = 'ELM327 v1.5'; }
  async close() {}
  async raw(text) {
    await sleep(20 + Math.random() * 25);
    const c = text.toUpperCase().replace(/\s/g, '');
    const hx = a => a.map(x => h1(Math.max(0, Math.min(255, Math.round(x))))).join('');
    if (c.startsWith('AT')) {
      if (c === 'ATZ') return '\r\rELM327 v1.5\r\r';
      if (c === 'ATRV') return '14.1V\r\r';
      if (c === 'ATDPN') return 'A6\r\r';
      if (c === 'ATDP') return 'AUTO, ISO 15765-4 (CAN 11/500)\r\r';
      return 'OK\r\r';
    }
    const t = (Date.now() - this.t0) / 1000, thr = Math.max(0, Math.sin(t / 1.7)) ** 3;
    if (c === '03') return (this.cleared ? '4300' : '430203012187') + '\r\r';    // P0301, P2187
    if (c === '07') return '4700\r\r';
    if (c === '0A') return 'NO DATA\r\r';
    if (c === '04') { this.cleared = true; return '44\r\r'; }
    if (c === '0902') {
      const vin = 'DEMO1POLO20130000';
      const all = [0x49, 0x02, 0x01, ...[...vin].map(ch => ch.charCodeAt(0))];
      let s = '014\r0:' + hx(all.slice(0, 6)) + '\r';
      for (let k = 6, n = 1; k < all.length; k += 7, n++) s += n.toString(16).toUpperCase() + ':' + hx(all.slice(k, k + 7)) + '\r';
      return s + '\r';
    }
    if (c.startsWith('01') && c.length === 4) {
      const p = parseInt(c.slice(2), 16);
      const SUP = [0x01, 0x04, 0x05, 0x06, 0x07, 0x0B, 0x0C, 0x0D, 0x0E, 0x0F, 0x11, 0x2F, 0x42, 0x46];
      if (p === 0x00 || p === 0x20 || p === 0x40) {
        const m = [0, 0, 0, 0];
        for (const s of SUP) if (s > p && s <= p + 32) { const i = s - p - 1; m[i >> 3] |= 0x80 >> (i & 7); }
        if (SUP.some(s => s > p + 32)) m[3] |= 1;
        return '41' + h1(p) + hx(m) + '\r\r';
      }
      const rpm = 760 + thr * 5300 + Math.random() * 25;
      const V = {
        0x01: this.cleared ? [0x00, 0x07, 0x65, 0x65] : [0x82, 0x07, 0x65, 0x01],
        0x04: [(18 + thr * 70) * 2.55], 0x05: [Math.min(90, 45 + t * 1.5) + 40],
        0x06: [128 + (Math.random() * 8 - 4) * 1.28], 0x07: [128 + 4 * 1.28],
        0x0B: [30 + thr * 65], 0x0C: [(rpm * 4) >> 8, (rpm * 4) & 255], 0x0D: [0],
        0x0E: [(8 + thr * 18 + 64) * 2], 0x0F: [24 + 40], 0x11: [(14 + thr * 80) * 2.55],
        0x2F: [62 * 2.55], 0x42: [14100 >> 8, 14100 & 255], 0x46: [12 + 40],
      }[p];
      return V ? '41' + h1(p) + hx(V) + '\r\r' : 'NO DATA\r\r';
    }
    return '?\r\r';
  }
}

let elm = null, elmMode = null, elmQueue = Promise.resolve();
const polo = { can: true, proto: '', supported: null };

// Команда адаптеру; запросы выполняются строго по одному и пишутся в журнал
function elmCmd(text, timeout = 3000) {
  const job = elmQueue.then(async () => {
    log('tx', '→ ' + text);
    try {
      const r = await elm.raw(text, timeout);
      const lines = r.split(/[\r\n]+/).map(s => s.trim()).filter(s => s && s !== text);
      log('rx', '← ' + (lines.join(' | ') || '(пусто)'));
      return lines;
    } catch (e) { log('er', '✕ ' + (e.message === 'timeout' ? 'нет ответа от адаптера' : e.message)); throw e; }
  });
  elmQueue = job.catch(() => {});
  return job;
}
async function obd(req, timeout = 3000) {
  const lines = (await elmCmd(req, timeout)).filter(l => !/SEARCHING/i.test(l));
  if (lines.some(l => /NO DATA/i.test(l))) throw new Error('nodata');
  const err = lines.find(l => /ERROR|UNABLE|STOPPED|BUS|^\?$/i.test(l));
  if (err) throw new Error(err);
  return lines;
}
// Склеить ответ (в том числе многокадровый CAN: «014», «0:…», «1:…») в массив байт
function obdBytes(lines) {
  const out = [];
  for (const l of lines) {
    let s = l.replace(/\s/g, '');
    if (/^[0-9A-F]{3}$/i.test(s)) continue;        // строка с длиной ответа
    s = s.replace(/^[0-9A-F]:/i, '');
    if (!/^[0-9A-F]+$/i.test(s)) continue;
    for (let i = 0; i + 1 < s.length; i += 2) out.push(parseInt(s.slice(i, i + 2), 16));
  }
  return out;
}
async function readPid(p) {
  const b = obdBytes(await obd('01' + h1(p)));
  const i = b.findIndex((x, k) => x === 0x41 && b[k + 1] === p);
  if (i < 0) throw new Error('неожиданный ответ');
  return b.slice(i + 2);
}
async function elmInit() {
  for (const c of ['ATE0', 'ATL0', 'ATS0', 'ATH0', 'ATAT1']) await elmCmd(c);
  const probe = async t => { try { return obdBytes(await obd('0100', t)).includes(0x41); } catch { return false; } };
  await elmCmd('ATSP6');                         // Polo 2013: CAN 11 бит, 500 кбит/с
  let ok = await probe(4000);
  if (!ok) { await elmCmd('ATSP0'); ok = await probe(12000); }   // запасной вариант — автоопределение
  if (!ok) throw new Error('Блок двигателя не отвечает. Включите зажигание (приборная панель должна гореть) и попробуйте снова.');
  const dpn = (await elmCmd('ATDPN'))[0] || '';
  polo.can = /^A?[6-9AB]/i.test(dpn);
  polo.proto = ((await elmCmd('ATDP'))[0] || '').replace(/^AUTO,\s*/i, '');
  // Обращаемся только к двигателю (иначе на общий запрос отвечают и другие блоки)
  if (polo.can) { await elmCmd('ATSH7E0'); await elmCmd('ATCRA7E8'); }
}
async function supportedPids() {
  const set = new Set();
  for (const base of [0x00, 0x20, 0x40]) {
    let d;
    try { d = await readPid(base); } catch { break; }
    for (let i = 0; i < 32; i++) if (d[i >> 3] & (0x80 >> (i & 7))) set.add(base + i + 1);
    if (!set.has(base + 0x20)) break;
  }
  return set;
}
async function poloConnect(kind) {
  try {
    elm = kind === 'demo' ? new ElmDemo() : new ElmTransport();
    elmQueue = Promise.resolve();
    await elm.open();
    elmMode = kind;
    await elmInit();
    polo.supported = await supportedPids();
    log('inf', `VW Polo: связь установлена (${polo.proto}), параметров для чтения: ${polo.supported.size}.`);
    announce(kind === 'demo' ? 'Включён демо-режим VW Polo' : 'ELM327 подключён, связь с двигателем есть');
  } catch (e) {
    try { await elm?.close(); } catch {}
    elm = null; elmMode = null;
    if (e.name !== 'NotFoundError') modal('Ошибка подключения', esc(e.message === 'timeout' ? 'Адаптер не ответил. Проверьте, что он вставлен в разъём и выбран правильный порт.' : e.message), [['OK', 0, 1]]);
  }
  render();
}
async function poloDisconnect() {
  stopPoll(); try { await elm?.close(); } catch {}
  elm = null; elmMode = null; polo.supported = null; polo.proto = '';
  log('inf', 'VW Polo: адаптер отключён.'); announce('Адаптер отключён');
  render();
}
const needElm = () => { if (!elm) { modal('Нет связи', 'Сначала подключите ELM327 или включите демо-режим в разделе VW Polo.', [['OK', 0, 1]]); return true; } return false; };

// --- Коды неисправностей OBD2 ---
async function readDtcs(mode) {           // '03' — подтверждённые, '07' — ожидающие, '0A' — постоянные
  let lines;
  try { lines = await obd(mode, 5000); } catch (e) { if (e.message === 'nodata') return []; throw e; }
  const resp = parseInt(mode, 16) + 0x40;
  let pairs = [];
  if (polo.can) {
    const b = obdBytes(lines), i = b.indexOf(resp);
    if (i < 0) return [];
    const n = b[i + 1];
    pairs = b.slice(i + 2, i + 2 + n * 2);
  } else {
    for (const l of lines) { const b = obdBytes([l]); if (b[0] === resp) pairs.push(...b.slice(1, 7)); }
  }
  const out = [];
  for (let k = 0; k + 1 < pairs.length; k += 2) {
    const A = pairs[k], B = pairs[k + 1];
    if (!A && !B) continue;
    out.push('PCBU'[A >> 6] + ((A >> 4) & 3) + (A & 15).toString(16).toUpperCase() + h1(B));
  }
  return [...new Set(out)];
}

// Если кода нет в справочнике — хотя бы группа по стандарту
function obdInfo(code) {
  if (OBD_DB[code]) return { ...OBD_DB[code], known: true };
  const L = code[0], d1 = code[1], d2 = code[2];
  // По SAE J2012 коды производителя: P1xxx, P30xx–P33xx, а также B1/B2, C1/C2, U1/U2
  const manuf = d1 === '1' || (L === 'P' && d1 === '3' && d2 <= '3') || (L !== 'P' && d1 === '2');
  if (manuf) return { plain: 'Код производителя (VAG)', official: 'Manufacturer controlled DTC', fix: ['Точную расшифровку смотрите в VCDS, «ВАСЯ Диагност» или у дилера VW.'] };
  const groups = { P: { '0': 'топливо и воздух', '1': 'топливо и воздух', '2': 'топливо (форсунки)', '3': 'зажигание и пропуски', '4': 'системы снижения токсичности', '5': 'скорость и холостой ход', '6': 'блок управления и его цепи', '7': 'коробка передач', '8': 'коробка передач', '9': 'коробка передач', 'A': 'гибридная система' },
                   C: 'шасси (ABS, ESP)', B: 'кузов', U: 'связь между блоками' };
  const g = typeof groups[L] === 'string' ? groups[L] : groups[L]?.[d2] || 'прочее';
  return { plain: `Код не найден в справочнике — группа: ${g}`, official: '', fix: ['Найдите расшифровку по номеру кода в документации VW или в VCDS.'] };
}

  { pid: 0x07, name: 'Долгосрочная коррекция топлива', unit: '%', min: -25, max: 25, warn: 20, dec: 1, type: 'bar', calc: d => (d[0] - 128) * 100 / 128 },
  { pid: 0x10, name: 'Расход воздуха', unit: 'г/с', min: 0, max: 100, warn: null, dec: 1, type: 'number', calc: d => (d[0] * 256 + d[1]) / 100 },
