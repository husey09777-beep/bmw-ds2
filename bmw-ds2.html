<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMW DS2 Диагностика</title>
<style>
  :root {
    --bar: #14233a; --bar2: #1d3253; --bg: #e9edf2; --card: #ffffff; --line: #d4dae3;
    --text: #1b2430; --muted: #6b7686; --blue: #1677d2; --blue2: #0f5fae;
    --ok: #1f9d55; --warn: #e08a00; --err: #d93a35;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; user-select: none; }

  /* Верхняя панель */
  .topbar { background: linear-gradient(var(--bar2), var(--bar)); color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 16px; height: 52px; flex: none; }
  .brand { font-weight: 700; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #fff; background: conic-gradient(#1677d2 0 25%, #fff 0 50%, #1677d2 0 75%, #fff 0); }
  .crumbs { flex: 1; display: flex; gap: 6px; align-items: center; font-size: 14px; color: #b9c6d8; overflow: hidden; white-space: nowrap; }
  .crumbs span { cursor: pointer; } .crumbs span:last-child { color: #fff; cursor: default; }
  .crumbs i { font-style: normal; opacity: .5; }
  .vci { display: flex; align-items: center; gap: 8px; font-size: 13px; background: rgba(255,255,255,.08); padding: 5px 10px; border-radius: 6px; }
  .vci .led { width: 10px; height: 10px; border-radius: 50%; background: #5b6b80; box-shadow: inset 0 0 2px #000; }
  .vci.on .led { background: #33d17a; box-shadow: 0 0 6px #33d17a; }
  .vci.demo .led { background: #ffb020; box-shadow: 0 0 6px #ffb020; }
  .clock { font-variant-numeric: tabular-nums; font-size: 13px; color: #b9c6d8; }

  /* Информационная строка автомобиля */
  .vehicle { background: var(--card); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; gap: 24px; font-size: 13px; color: var(--muted); flex: none; flex-wrap: wrap; }
  .vehicle b { color: var(--text); font-weight: 600; }

  /* Экран */
  .screen { flex: 1; overflow: auto; padding: 18px; }
  .screen > div { max-width: 1200px; margin: 0 auto; }
  .title { font-size: 18px; font-weight: 600; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  .title small { font-size: 13px; color: var(--muted); font-weight: 400; }

  /* Плитки */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 12px 14px; text-align: center; cursor: pointer;
          box-shadow: 0 1px 2px rgba(0,0,0,.05); transition: transform .08s, box-shadow .08s; }
  .tile:hover { box-shadow: 0 4px 14px rgba(20,35,58,.15); transform: translateY(-1px); }
  .tile:active { transform: translateY(1px); }
  .tile.disabled { opacity: .45; pointer-events: none; }
  .tile .ic { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 14px; display: grid; place-items: center; color: #fff; }
  .tile .ic svg { width: 34px; height: 34px; }
  .tile .nm { font-weight: 600; } .tile .ds { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .c1 { background: linear-gradient(#2b8ae6, #1466b8); } .c2 { background: linear-gradient(#26b06b, #158a4f); }
  .c3 { background: linear-gradient(#f39b1f, #d27800); } .c4 { background: linear-gradient(#e2514c, #b8302b); }
  .c5 { background: linear-gradient(#7d6ae0, #5845c2); } .c6 { background: linear-gradient(#5b6b80, #3e4b5c); }

  /* Таблицы */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table.grid { width: 100%; border-collapse: collapse; }
  .grid th { background: #f2f5f9; text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .grid td { padding: 11px 14px; border-bottom: 1px solid #edf0f4; }
  .grid tr:last-child td { border-bottom: none; }
  .grid tr.click { cursor: pointer; } .grid tr.click:hover td { background: #f5f9ff; }
  .grid tr.sel td { background: #e7f1fc; }
  .mono { font-family: var(--mono); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .b-ok { background: #e2f5ea; color: var(--ok); } .b-err { background: #fde8e7; color: var(--err); }
  .b-wait { background: #eef1f5; color: var(--muted); } .b-warn { background: #fff3dc; color: var(--warn); }
  .b-run { background: #e3effc; color: var(--blue); }
  .progress { height: 6px; background: #dfe4ea; border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .progress div { height: 100%; width: 0; background: var(--blue); transition: width .2s; }
  .hint { background: #fff8e6; border: 1px solid #f5dfa8; color: #7a5a00; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 14px; }
  .hint.info { background: #eaf3fd; border-color: #c6dcf5; color: #1d4f85; }
  .hint.bad { background: #fdecea; border-color: #f4c3c0; color: #8c201c; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .big-ok { padding: 36px; text-align: center; }
  .big-ok .n { font-size: 44px; font-weight: 700; } .big-ok .l { color: var(--muted); }

  .split { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; }
  @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
  canvas { width: 100%; height: 220px; display: block; }
  .graph-head { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .graph-head b { color: var(--text); font-size: 20px; font-family: var(--mono); margin-left: 6px; }

  input.field { font: inherit; font-family: var(--mono); padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
  label.lbl { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .form { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; padding: 14px; }

  #logbox { font-family: var(--mono); font-size: 12.5px; padding: 12px 14px; margin: 0; white-space: pre-wrap; word-break: break-all; min-height: 300px; max-height: 60vh; overflow: auto; background: #0e1724; color: #c9d4e3; user-select: text; }
  .tx { color: #79b4ff; } .rx { color: #7ee0a3; } .er { color: #ff8b86; } .inf { color: #8090a6; }

  .help p { margin: 0 0 10px; } .help { padding: 16px 18px; font-size: 14px; }
  .help h3 { margin: 16px 0 8px; font-size: 15px; } .help h3:first-child { margin-top: 0; }

  /* Карточки ошибок */
  .dtc { padding: 14px 16px; border-bottom: 1px solid #edf0f4; display: grid; grid-template-columns: 92px 1fr auto; gap: 4px 14px; align-items: start; }
  .dtc:last-child { border-bottom: none; }
  .dtc-code { font-family: var(--mono); font-weight: 700; font-size: 18px; color: var(--err); background: #fdecea; border-radius: 6px; text-align: center; padding: 6px 4px; }
  .dtc-code.unk { color: var(--muted); background: #eef1f5; }
  .dtc-code small { display: block; font-size: 10px; font-weight: 400; color: var(--muted); }
  .dtc-plain { font-weight: 600; font-size: 15px; }
  .dtc-off { font-weight: 400; color: var(--muted); }
  .dtc-meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }
  .dtc-fix { grid-column: 2 / 4; background: #f6f8fb; border-radius: 8px; padding: 10px 14px; margin-top: 6px; font-size: 13.5px; }
  .dtc-fix b { display: block; margin-bottom: 4px; }
  .dtc-fix ol { margin: 0; padding-left: 20px; } .dtc-fix li { margin: 3px 0; }
  .dtc .lnk { font: inherit; font-size: 12px; color: var(--blue); background: none; border: 1px solid #c6dcf5; border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  .dtc .lnk:hover { background: #eaf3fd; }
  .sumbar { padding: 12px 16px; border-bottom: 1px solid var(--line); background: #fff7f6; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .sumbar b.n { font-size: 20px; color: var(--err); }
  .search { width: 100%; font: inherit; padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; background: #fff; }
  @media (max-width: 600px) { .dtc { grid-template-columns: 70px 1fr; } .dtc-fix { grid-column: 1 / 3; } .dtc .lnk { grid-column: 1 / 3; justify-self: start; } }

  .okc { color: var(--ok) !important; background: #e2f5ea !important; }

  /* Переключатель темы */
  .themebtn { background: rgba(255,255,255,.08); border: 0; color: #c9d4e3; width: 34px; height: 34px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
  .themebtn:hover { background: rgba(255,255,255,.16); color: #fff; }
  .themebtn svg { width: 18px; height: 18px; }

  /* ===== Тёмная тема ===== */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bar: #0a0f17; --bar2: #142034; --bg: #0e131a; --card: #171e28; --line: #2a3441; --text: #e3e8ef; --muted: #8a96a6;
    --blue: #3b8ef0; --blue2: #2a78d6; --ok: #3ccf7c; --warn: #f2a93b; --err: #ff6b65;
  }
  :root[data-theme="dark"] .grid th { background: #1d2532; }
  :root[data-theme="dark"] .grid td { border-bottom-color: #232c38; }
  :root[data-theme="dark"] .grid tr.click:hover td { background: #1c2633; }
  :root[data-theme="dark"] .grid tr.sel td { background: #1a2d45; }
  :root[data-theme="dark"] .tile { box-shadow: none; }
  :root[data-theme="dark"] .tile:hover { box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  :root[data-theme="dark"] .b-ok { background: rgba(60,207,124,.15); }
  :root[data-theme="dark"] .b-err { background: rgba(255,107,101,.15); }
  :root[data-theme="dark"] .b-wait { background: #232c38; }
  :root[data-theme="dark"] .b-warn { background: rgba(242,169,59,.15); }
  :root[data-theme="dark"] .b-run { background: rgba(59,142,240,.18); }
  :root[data-theme="dark"] .progress { background: #232c38; }
  :root[data-theme="dark"] .hint { background: rgba(242,169,59,.09); border-color: rgba(242,169,59,.3); color: #f0c675; }
  :root[data-theme="dark"] .hint.info { background: rgba(59,142,240,.09); border-color: rgba(59,142,240,.3); color: #9cc7f7; }
  :root[data-theme="dark"] .hint.bad { background: rgba(255,107,101,.09); border-color: rgba(255,107,101,.3); color: #ffa29d; }
  :root[data-theme="dark"] input.field, :root[data-theme="dark"] .search { background: #0e131a; color: var(--text); border-color: var(--line); }
  :root[data-theme="dark"] .dlg { background: var(--card); color: var(--text); }
  :root[data-theme="dark"] .dlg button { background: #232c38; color: var(--text); border-color: var(--line); }
  :root[data-theme="dark"] .dlg button.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
  :root[data-theme="dark"] .dtc { border-bottom-color: #232c38; }
  :root[data-theme="dark"] .dtc-code { background: rgba(255,107,101,.12); }
  :root[data-theme="dark"] .dtc-code.unk { background: #232c38; }
  :root[data-theme="dark"] .dtc-fix { background: #1d2532; }
  :root[data-theme="dark"] .dtc .lnk { border-color: rgba(59,142,240,.4); }
  :root[data-theme="dark"] .dtc .lnk:hover { background: rgba(59,142,240,.12); }
  :root[data-theme="dark"] .sumbar { background: rgba(255,107,101,.06); }
  :root[data-theme="dark"] .okc { background: rgba(60,207,124,.15) !important; }
  :root[data-theme="dark"] #logbox { background: #0a0f17; }

  /* ===== Заставка ===== */
  #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; cursor: pointer;
            background: radial-gradient(circle at 50% 45%, #1b2c46 0%, #0a0f17 70%); color: #fff; transition: opacity .6s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }
  .sp-wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .sp-emblem { width: min(220px, 50vw); height: min(220px, 50vw); filter: drop-shadow(0 10px 40px rgba(22,119,210,.35)); animation: spIn 1s cubic-bezier(.2,.8,.2,1) both; }
  .sp-emblem img { width: 100%; height: 100%; object-fit: contain; }
  .sp-ring { stroke-dasharray: 600; stroke-dashoffset: 600; animation: spDraw 1.1s .15s ease-out forwards; }
  .sp-quads { transform-origin: 100px 100px; animation: spSpin 1.4s .3s cubic-bezier(.2,.8,.2,1) both; }
  .sp-text { font-weight: 700; letter-spacing: .5em; font-size: 11px; fill: #fff; opacity: 0; animation: spFade .6s 1s forwards; }
  .sp-title { font-size: 22px; font-weight: 600; letter-spacing: .08em; opacity: 0; animation: spUp .7s 1.1s forwards; }
  .sp-sub { font-size: 13px; color: #8a9bb3; letter-spacing: .2em; text-transform: uppercase; opacity: 0; animation: spUp .7s 1.3s forwards; }
  .sp-bar { width: 180px; height: 3px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; opacity: 0; animation: spFade .3s 1.3s forwards; }
  .sp-bar div { height: 100%; width: 0; background: linear-gradient(90deg, #1677d2, #6fb3ff); animation: spLoad 1.2s 1.4s ease-in-out forwards; }
  .sp-skip { position: absolute; bottom: 22px; font-size: 12px; color: #5d6d84; }
  @keyframes spIn { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes spDraw { to { stroke-dashoffset: 0; } }
  @keyframes spSpin { from { transform: rotate(-270deg) scale(.3); opacity: 0; } to { transform: rotate(0) scale(1); opacity: 1; } }
  @keyframes spFade { to { opacity: 1; } }
  @keyframes spUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes spLoad { to { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation-duration: .01s !important; animation-delay: 0s !important; transition: none; } }

  /* Нижняя панель */
  .bottombar { background: var(--bar); flex: none; display: flex; gap: 2px; padding: 6px 8px; }
  .bottombar button { flex: 0 0 auto; min-width: 92px; background: transparent; border: 0; color: #c9d4e3; border-radius: 6px; padding: 6px 10px;
                      font: inherit; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .bottombar button svg { width: 22px; height: 22px; }
  .bottombar button:hover:not(:disabled) { background: rgba(255,255,255,.08); color: #fff; }
  .bottombar button:disabled { opacity: .3; cursor: default; }
  .bottombar button.act { background: var(--blue); color: #fff; }
  .bottombar button.act:hover:not(:disabled) { background: var(--blue2); }
  .bottombar button.red { color: #ff9c97; }
  .bottombar .sp { flex: 1; }

  /* ===== Телефон ===== */
  @media (max-width: 600px) {
    body { font-size: 14px; }
    .topbar { gap: 8px; padding: 0 10px; height: 48px; }
    .brand { font-size: 0; gap: 0; }               /* на узком экране остаётся только эмблема */
    .crumbs { font-size: 12.5px; }
    .crumbs span:not(:last-child), .crumbs i { display: none; }
    .vci { padding: 6px; } .vci span, .clock { display: none; }
    .vehicle { gap: 4px 14px; padding: 6px 12px; font-size: 12px; }
    .screen { padding: 12px; }
    .title { font-size: 16px; flex-wrap: wrap; gap: 2px 10px; }
    .tiles { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .tile { padding: 14px 8px 12px; }
    .tile .ic { width: 52px; height: 52px; border-radius: 12px; }
    .tile .ic svg { width: 28px; height: 28px; }
    .tile .ds { font-size: 11px; }
    .grid th, .grid td { padding: 9px 10px; }
    .bottombar { padding: 4px 2px calc(4px + env(safe-area-inset-bottom)); gap: 0; }
    .bottombar .sp { flex: 0; }
    .bottombar button { flex: 1 1 0; min-width: 0; padding: 6px 2px; font-size: 10.5px; }
    .bottombar button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    canvas { height: 170px; }
    .form { padding: 12px; }
  }

  /* Модальное окно */
  .modal { position: fixed; inset: 0; background: rgba(10,20,35,.55); display: none; place-items: center; z-index: 10; }
  .modal.show { display: grid; }
  .dlg { background: #fff; border-radius: 10px; width: min(440px, 92vw); overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .dlg h4 { margin: 0; padding: 12px 16px; background: var(--bar); color: #fff; font-size: 15px; }
  .dlg p { padding: 18px 16px; margin: 0; }
  .dlg .btns { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px 16px; }
  .dlg button { font: inherit; padding: 8px 18px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .dlg button.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
</style>
</head>
<body>

<div id="splash" title="Нажмите, чтобы пропустить">
  <div class="sp-wrap">
    <div class="sp-emblem" id="spEmblem">
      <svg viewBox="0 0 200 200">
        <defs><path id="spArc" d="M 100 100 m -78 0 a 78 78 0 1 1 156 0 a 78 78 0 1 1 -156 0"/></defs>
        <circle cx="100" cy="100" r="96" fill="#111"/>
        <circle class="sp-ring" cx="100" cy="100" r="95" fill="none" stroke="#c8d2df" stroke-width="2"/>
        <g class="sp-quads">
          <circle cx="100" cy="100" r="60" fill="#fff"/>
          <path d="M100 100 V40 A60 60 0 0 1 160 100 Z" fill="#1677d2"/>
          <path d="M100 100 V160 A60 60 0 0 1 40 100 Z" fill="#1677d2"/>
        </g>
        <circle cx="100" cy="100" r="62" fill="none" stroke="#c8d2df" stroke-width="2"/>
        <text class="sp-text"><textPath href="#spArc" startOffset="50%" text-anchor="middle">DS2 · SCAN · DIAGNOSE</textPath></text>
      </svg>
    </div>
    <div class="sp-title">Диагностика BMW</div>
    <div class="sp-sub">DS2 · K-line · E30 / E34</div>
    <div class="sp-bar"><div></div></div>
  </div>
  <div class="sp-skip">нажмите, чтобы пропустить</div>
</div>

<div class="topbar">
  <div class="brand"><div class="logo"></div>DS2 SCAN</div>
  <div class="crumbs" id="crumbs"></div>
  <div class="vci" id="vci"><div class="led"></div><span id="vciText">Адаптер не подключён</span></div>
  <button class="themebtn" id="themeBtn" title="Тёмная / светлая тема"></button>
  <div class="clock" id="clock"></div>
</div>

<div class="vehicle">
  <div>Автомобиль: <b>BMW E30 / E34</b></div>
  <div>Протокол: <b>DS2 · K-line · 9600 8E1</b></div>
  <div>Адаптер: <b id="vehAdapter">—</b></div>
</div>

<div class="screen"><div id="view"></div></div>

<div class="bottombar" id="bottombar"></div>

<div class="modal" id="modal"><div class="dlg">
  <h4 id="mTitle"></h4><p id="mText"></p>
  <div class="btns" id="mBtns"></div>
</div></div>

<script>
// ===================== Справочники =====================
const MODULES = [
  { addr: 0x12, name: 'DME — система управления двигателем', short: 'DME' },
  { addr: 0x13, name: 'DME 2 — второй ряд цилиндров (V8/V12)', short: 'DME 2' },
  { addr: 0x32, name: 'EGS — автоматическая коробка передач', short: 'EGS' },
  { addr: 0x56, name: 'ABS / ASC — тормозная система', short: 'ABS' },
  { addr: 0xA4, name: 'Airbag — система пассивной безопасности', short: 'Airbag' },
  { addr: 0x80, name: 'KOMBI — комбинация приборов', short: 'KOMBI' },
  { addr: 0x00, name: 'ZKE — кузовная электроника, центр. замок', short: 'ZKE' },
  { addr: 0x5B, name: 'IHKA — климат-контроль', short: 'IHKA' },
  { addr: 0x44, name: 'EWS — иммобилайзер', short: 'EWS' },
  { addr: 0xD0, name: 'LKM — модуль управления светом', short: 'LKM' },
];
const RESP = { 0xA0: 'OK', 0xA1: 'Блок занят', 0xA2: 'Команда отклонена', 0xB0: 'Ошибка параметра', 0xFF: 'Команда не поддерживается' };

// ===================== Справочник кодов Motronic (4-значные коды BMW, E30/E34/E36 ~1987–1995) =====================
// plain — понятное описание, official — официальное наименование, fix — что проверить по порядку
const DTC_DB = {
  '1211': { plain: 'Неисправность блока управления двигателем', official: 'DME control unit', fix: [

// ===================== Транспорт: общая часть (буфер приёма, эхо, разбор ответа) =====================
class ByteTransport {
  constructor() { this.buf = []; this.waiters = []; }
  push(bytes) {
    for (const b of bytes) this.buf.push(b);
    this.waiters.forEach(w => w());
  }
  waitBytes(n, timeout) {
    return new Promise((resolve, reject) => {
      if (this.buf.length >= n) return resolve();
      const check = () => { if (this.buf.length >= n) { done(); resolve(); } };
      const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, timeout);
      const done = () => { clearTimeout(timer); this.waiters = this.waiters.filter(w => w !== check); };
      this.waiters.push(check);
    });
  }
  async request(msg, timeout = 1000) {
    this.buf = [];
    await this.send(new Uint8Array(msg));
    // KKL-кабели возвращают эхо отправленных байт — убираем его
    try {
      await this.waitBytes(msg.length, 300);
      if (this.buf.slice(0, msg.length).every((b, i) => b === msg[i])) this.buf.splice(0, msg.length);
    } catch { /* эха нет */ }
    await this.waitBytes(2, timeout);
    const len = this.buf[1];
    if (len < 3) throw new Error('некорректная длина ответа');
    await this.waitBytes(len, timeout);
    return this.buf.splice(0, len);
  }
}

// ===================== Транспорт: кабель через Web Serial (Windows / macOS / Linux) =====================
class SerialTransport extends ByteTransport {
  get label() { return 'USB K-line (KKL / K+DCAN)'; }
  async open() {
    if (!('serial' in navigator)) throw new Error('Браузер не поддерживает Web Serial. Откройте страницу в Chrome или Edge.');
    this.port = await navigator.serial.requestPort();
    await this.port.open({ baudRate: 9600, dataBits: 8, parity: 'even', stopBits: 1, bufferSize: 4096 });
    this.writer = this.port.writable.getWriter();
    this.readLoop();
  }
  async readLoop() {
    this.reader = this.port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await this.reader.read();
        if (done) break;
        this.push(value);
      }
    } catch (e) { log('er', 'Ошибка чтения порта: ' + e.message); }
    finally { this.reader.releaseLock(); }
  }
  send(data) { return this.writer.write(data); }
  async close() {
    try { await this.reader?.cancel(); } catch {}
    try { this.writer?.releaseLock(); } catch {}
    try { await this.port?.close(); } catch {}
  }
}

// ===================== Транспорт: кабель FTDI через WebUSB (Android) =====================
// Приложение само настраивает чип FTDI управляющими запросами, как это делает драйвер на компьютере.
const FTDI = {
  VID: 0x0403,
  RESET: 0x00, MODEM_CTRL: 0x01, FLOW_CTRL: 0x02, BAUDRATE: 0x03, DATA: 0x04, LATENCY: 0x09,
  BAUD_9600: 0x4138,                    // делитель 312,5 от 3 МГц
  DATA_8E1: 0x0008 | (2 << 8),          // 8 бит, чётность even, 1 стоп-бит
  DTR_RTS_ON: 0x0303,
};
class UsbFtdiTransport extends ByteTransport {
  get label() { return 'USB FTDI (WebUSB, Android)'; }
  async open() {
    if (!('usb' in navigator)) throw new Error('Браузер не поддерживает WebUSB. Откройте страницу в Chrome на Android.');
    this.dev = await navigator.usb.requestDevice({ filters: [{ vendorId: FTDI.VID }] });
    await this.dev.open();
    if (!this.dev.configuration) await this.dev.selectConfiguration(1);
    const iface = this.dev.configuration.interfaces[0];
    try { await this.dev.claimInterface(iface.interfaceNumber); }
    catch (e) {
      throw new Error('Не удалось захватить кабель. На компьютере его занимает драйвер — там используйте обычное подключение. (' + e.message + ')');
    }
    const eps = iface.alternate.endpoints;
    this.epIn = eps.find(e => e.direction === 'in' && e.type === 'bulk');
    this.epOut = eps.find(e => e.direction === 'out' && e.type === 'bulk');
    if (!this.epIn || !this.epOut) throw new Error('У устройства нет нужных каналов обмена — похоже, это не кабель FTDI.');
    this.index = iface.interfaceNumber + 1;   // порт A
    await this.ctrl(FTDI.RESET, 0);
    await this.ctrl(FTDI.BAUDRATE, FTDI.BAUD_9600, 0);
    await this.ctrl(FTDI.DATA, FTDI.DATA_8E1);
    await this.ctrl(FTDI.FLOW_CTRL, 0);
    await this.ctrl(FTDI.MODEM_CTRL, FTDI.DTR_RTS_ON);
    await this.ctrl(FTDI.LATENCY, 2);          // быстрее отдавать ответ (по умолчанию 16 мс)
    this.closed = false;
    this.onDisc = e => { if (e.device === this.dev) { this.closed = true; log('er', 'Кабель отключён от телефона.'); } };
    navigator.usb.addEventListener('disconnect', this.onDisc);
    this.readLoop();
  }
  async ctrl(request, value, index = this.index) {
    const r = await this.dev.controlTransferOut({ requestType: 'vendor', recipient: 'device', request, value, index });
    if (r.status !== 'ok') throw new Error('FTDI: ошибка настройки (запрос ' + request + ')');
  }
  async readLoop() {
    const size = this.epIn.packetSize || 64;
    while (!this.closed) {
      try {
        const r = await this.dev.transferIn(this.epIn.endpointNumber, size);
        if (r.status === 'stall') { await this.dev.clearHalt('in', this.epIn.endpointNumber); continue; }
        const d = r.data;
        // FTDI добавляет 2 байта статуса в начало каждого пакета по 64 байта
        for (let off = 0; d && off < d.byteLength; off += size) {
          const end = Math.min(off + size, d.byteLength);
          if (end - off > 2) this.push(new Uint8Array(d.buffer, d.byteOffset + off + 2, end - off - 2));
        }
      } catch (e) {
        if (!this.closed) log('er', 'Ошибка чтения USB: ' + e.message);
        break;
      }
    }
  }
  async send(data) {
    const r = await this.dev.transferOut(this.epOut.endpointNumber, data);
    if (r.status !== 'ok') throw new Error('FTDI: ошибка отправки');
  }
  async close() {
    this.closed = true;
    navigator.usb?.removeEventListener('disconnect', this.onDisc);
    try { await this.dev?.releaseInterface(this.dev.configuration.interfaces[0].interfaceNumber); } catch {}
    try { await this.dev?.close(); } catch {}
  }
}
const IS_ANDROID = /Android/i.test(navigator.userAgent);

// ===================== Транспорт: демо (выдуманные ответы) =====================
class DemoTransport {
  async open() {} async close() {}
  async request(msg) {
    await sleep(110);
    const [addr, , cmd, sub] = msg;
    if (![0x12, 0x32, 0x56, 0x80].includes(addr)) throw new Error('timeout');
    const reply = data => { const m = [addr, data.length + 3, ...data]; m.push(xor(m)); return m; };
    const enc = s => Array.from(s, c => c.charCodeAt(0));
    if (cmd === 0x00) return reply([0xA0, ...enc('1730574'), ...enc('0213'), 0x05, 0x91, 0x23]);
    if (cmd === 0x04) return reply(addr === 0x12 ? [0xA0, 0x02, 0x1F, 0x03, 0x00, 0x2A, 0x01, 0x00] : [0xA0, 0x00]);
    if (cmd === 0x05) return reply([0xA0]);
    if (cmd === 0x0B && sub === 0x03) {
      const t = Date.now() / 900, rpm = 800 + Math.round(Math.sin(t) * 60 + Math.random() * 20);
      return reply([0xA0, rpm >> 8, rpm & 0xFF, 0x5A + Math.round(Math.sin(t / 3) * 4), 0x3C, 0x80 + Math.round(Math.random() * 4), 0x12, 0x00, 0x7F]);
    }
    return reply([0xFF]);
  }
}

// ===================== Протокол DS2 =====================
let transport = null, mode = null, queue = Promise.resolve();
const frame = (addr, data) => { const m = [addr, data.length + 3, ...data]; m.push(xor(m)); return m; };

function ds2(msg, timeout) {
  const job = queue.then(async () => {
    log('tx', '→ ' + hex(msg));
    try {
      const resp = await transport.request(msg, timeout);
      const ok = xor(resp) === 0;
      log(ok ? 'rx' : 'er', '← ' + hex(resp) + (ok ? '' : '   (неверная контрольная сумма)'));
      if (!ok) throw new Error('неверная контрольная сумма');
      return resp;
    } catch (e) { log('er', '✕ ' + (e.message === 'timeout' ? 'нет ответа' : e.message)); throw e; }
  });
  queue = job.catch(() => {});
  return job;
}
async function cmd(addr, data, timeout) {
  const r = await ds2(frame(addr, data), timeout);
  return { code: r[2], status: RESP[r[2]] || 'Код ' + h1(r[2]), data: r.slice(3, -1) };
}
const errText = e => e.message === 'timeout' ? 'Блок не ответил. Проверьте зажигание, переходник и перемычку 7–8.' : e.message;

const state = { stack: [], scan: {}, module: null, poll: null };
function go(screen, params = {}, replace = false) {
  stopPoll();
  if (replace) state.stack.pop();
  state.stack.push({ screen, params });
  render();
}
function back() { stopPoll(); if (state.stack.length > 1) { state.stack.pop(); render(); } }
function home() { stopPoll(); state.stack = [state.stack[0]]; render(); }
const cur = () => state.stack.at(-1);

function render() {
  const { screen, params } = cur();
  // путь
  $('crumbs').innerHTML = state.stack.map((s, i) => `<span data-i="${i}">${esc(SCREENS[s.screen].crumb(s.params))}</span>`).join('<i>›</i>');
  $('crumbs').querySelectorAll('span').forEach(sp => sp.onclick = () => {
    const i = +sp.dataset.i; if (i < state.stack.length - 1) { stopPoll(); state.stack.length = i + 1; render(); }
  });
  $('view').innerHTML = '';
  SCREENS[screen].draw($('view'), params);
  drawBar(SCREENS[screen].buttons ? SCREENS[screen].buttons(params) : []);
}

function drawBar(extra) {
  const bar = $('bottombar');
  bar.innerHTML = '';
  const add = (b) => {
    const el = document.createElement('button');
    el.innerHTML = ICON[b.icon] + `<span>${b.label}</span>`;
    if (b.cls) el.className = b.cls;
    el.disabled = !!b.disabled;
    el.onclick = b.onClick;
    if (b.id) el.id = b.id;
    bar.appendChild(el);
  };
  const deep = state.stack.length > 1;
  add({ icon: 'back', label: 'Назад', onClick: back, disabled: !deep });
  add({ icon: 'home', label: 'Главная', onClick: home, disabled: !deep });
  const sp = document.createElement('div'); sp.className = 'sp'; bar.appendChild(sp);
  extra.forEach(add);
  add({ icon: 'log', label: 'Журнал', onClick: () => go('log'), disabled: cur().screen === 'log' });
}

function modal(title, text, buttons) {
  return new Promise(resolve => {
    $('mTitle').textContent = title; $('mText').innerHTML = text;

  });
}

// ===================== Подключение =====================
function setVci(m) {
  mode = m;
  $('vci').className = 'vci' + (m === 'demo' ? ' demo' : m ? ' on' : '');
  $('vciText').textContent = m === 'demo' ? 'Демо-режим' : m ? 'Адаптер подключён' : 'Адаптер не подключён';
  $('vehAdapter').textContent = m === 'demo' ? 'демо (данные выдуманы)' : m ? transport.label : '—';
}
async function connect(kind) {
  try {
    transport = kind === 'demo' ? new DemoTransport() : kind === 'usb' ? new UsbFtdiTransport() : new SerialTransport();
    await transport.open();
    setVci(kind);
    log('inf', kind === 'demo' ? 'Демо-режим: ответы генерируются, машина не нужна.'
      : kind === 'usb' ? 'Кабель FTDI настроен через WebUSB: 9600 бод, 8E1.' : 'Порт открыт: 9600 бод, 8E1.');
  } catch (e) {
    try { await transport?.close(); } catch {}
    transport = null;
    if (e.name !== 'NotFoundError') modal('Ошибка подключения', esc(e.message), [['OK', 0, 1]]);
  }
  render();
}
async function disconnect() { stopPoll(); await transport?.close(); transport = null; setVci(null); state.scan = {}; log('inf', 'Отключено.'); home(); }

async function loadInto(v, p, data, view) {
  const box = h('<div class="card"><div class="empty">Чтение данных…</div></div>');
  v.appendChild(box);
  try {
    const r = await cmd(p.addr, data);
    if (cur().params !== p) return;
    if (r.code !== 0xA0) { box.innerHTML = `<div class="empty"><span class="badge b-warn">${esc(r.status)}</span></div>`; return; }
    box.replaceWith(view(r.data));
  } catch (e) {
    if (cur().params !== p) return;
    box.innerHTML = `<div class="empty"><span class="badge b-err">Нет связи</span><p>${esc(errText(e))}</p></div>`;
  }
}

function identView(d) {
  const asc = ascii(d);
  const rows = [
    ['Номер детали BMW', asc.slice(0, 7)],
    ['Аппаратная версия / индекс', asc.slice(7, 11)],
    ['Остальные байты', hex(d.slice(11)) || '—'],
    ['Ответ полностью (ASCII)', asc],
    ['Ответ полностью (HEX)', hex(d)],
  ];
  const wrap = h('<div></div>');
  wrap.appendChild(h(`<div class="card"><table class="grid"><thead><tr><th style="width:260px">Параметр</th><th>Значение</th></tr></thead><tbody>

    // Номер детали нужен, чтобы привязки кодов не путались между разными блоками
    let part = null;
    try { const id = await cmd(p.addr, [0x00]); if (id.code === 0xA0) part = ascii(id.data.slice(0, 7)); } catch {}
    const r = await cmd(p.addr, [0x04]);
    if (cur().params !== p) return;
    if (r.code !== 0xA0) { box.innerHTML = `<div class="empty"><span class="badge b-warn">${esc(r.status)}</span></div>`; return; }
    const ecu = part && /^\d{7}$/.test(part) ? part : 'A' + h1(p.addr);
    box.replaceWith(faultView(p, r.data, ecu));
  } catch (e) {
    if (cur().params !== p) return;
    box.innerHTML = `<div class="empty"><span class="badge b-err">Нет связи</span><p>${esc(errText(e))}</p></div>`;
  }
}

// Предварительный разбор: [кол-во, записи по N байт] — иначе каждый ненулевой байт считается кодом
function parseFaults(d) {
  if (!d.length || d.every(b => !b)) return [];
  const n = d[0], rest = d.length - 1;
  if (n > 0 && rest >= n && rest % n === 0) {
    const k = rest / n, out = [];
    for (let i = 0; i < n; i++) { const e = d.slice(1 + i * k, 1 + (i + 1) * k); out.push({ code: e[0], raw: e }); }
    return out;
  }
  return d.filter(b => b).map(b => ({ code: b, raw: [b] }));
}

function dtcCard(codeHtml, info, meta, unknown) {
  const el = h(`<div class="dtc">
    <div class="dtc-code${unknown ? ' unk' : ''}">${codeHtml}</div>
    <div>
      <div class="dtc-plain">${esc(info.plain)}${info.official ? ` <span class="dtc-off">(${esc(info.official)})</span>` : ''}</div>
      ${meta ? `<div class="dtc-meta">${meta}</div>` : ''}
    </div>
    <div class="act"></div>
    ${info.fix?.length ? `<div class="dtc-fix"><b>Что проверить:</b><ol>${info.fix.map(f => `<li>${esc(f)}</li>`).join('')}</ol></div>` : ''}
  </div>`);
  return el;
}

function faultView(p, d, ecu) {
  const wrap = h('<div></div>');
  const list = parseFaults(d);
  if (!list.length) {
    wrap.appendChild(h('<div class="card big-ok"><div class="n" style="color:var(--ok)">0</div><div class="l">Ошибок не обнаружено</div></div>'));
    return wrap;
  }
  const card = h(`<div class="card"><div class="sumbar"><span>Найдено записей: <b class="n">${list.length}</b></span><span>Блок: <b>${esc(ecu)}</b></span>${mode === 'demo' ? '<span class="badge b-warn">демо: данные выдуманы</span>' : ''}</div></div>`);
  for (const f of list) {
    const info = lookup(ecu, f.code);
    const meta = `код блока ${h1(f.code)} · байты ${hex(f.raw)}`;
    const el = info
      ? dtcCard(info.num ? `${info.num}<small>код ${h1(f.code)}</small>` : h1(f.code), info, meta, !info.num)
      : dtcCard(`${h1(f.code)}<small>нет в базе</small>`, { plain: 'Расшифровка для этого кода блока ещё не задана' }, meta + ' · нажмите «Привязать», чтобы указать, какой это код Motronic', true);
    if (mode !== 'demo') {
      const b = document.createElement('button');
      b.className = 'lnk'; b.textContent = info ? 'Изменить' : 'Привязать';
      b.onclick = () => assignCode(ecu, f.code, () => go('faults', p, true));
      el.querySelector('.act').appendChild(b);
    }
    card.appendChild(el);
  }
  wrap.appendChild(card);
  wrap.appendChild(h(`<div class="hint">Разбор ответа блока — предварительный: у каждой модели блока (M1.3, M1.7, M3.1…) своя нумерация внутренних кодов.
    Чтобы получить расшифровку, привяжите код блока к официальному 4-значному коду BMW. Его можно узнать миганием лампы Check Engine
    (см. «Справочник кодов») или по программе INPA. Привязка запоминается в этом браузере.</div>`));
  return wrap;
}

async function assignCode(ecu, code, done) {
  const map = loadMap(), key = ecu + ':' + code, curv = map[key];
  const ok = await modal('Привязка кода ' + h1(code),
    `Блок <b>${esc(ecu)}</b>, внутренний код <b>${h1(code)}</b>.<br><br>
     Введите 4-значный код Motronic (например <b>1222</b>) или своё описание. Пустое поле — удалить привязку.<br><br>
     <input class="field" id="mapIn" style="width:100%" value="${esc(curv ? (curv.ref || curv.text) : '')}">
     <div id="mapHint" style="font-size:12px;color:var(--muted);margin-top:6px"></div>`,
    [['Отмена', false], ['Сохранить', true, 1]]);
  if (!ok) return;
  const val = $('mapIn').value.trim();
  if (!val) delete map[key];
  else if (DTC_DB[val]) map[key] = { ref: val };
  else map[key] = { text: val };
  saveMap(map);
  log('inf', `Привязка ${key} → ${val || '(удалена)'}`);
  done();
}

async function clearFaults(addr) {
  const m = MODULES.find(x => x.addr === addr);
  const ok = await modal('Стирание кодов', `Стереть память неисправностей в блоке <b>${m.short}</b>?<br><br>Двигатель должен быть заглушен, зажигание включено.`, [['Отмена', false], ['Стереть', true, 1]]);
  if (!ok) return;
  try {
    const r = await cmd(addr, [0x05]);
    await modal('Стирание кодов', r.code === 0xA0 ? 'Память неисправностей очищена. Прочитайте коды ещё раз, чтобы проверить.' : 'Блок ответил: ' + esc(r.status), [['OK', 0, 1]]);
  } catch (e) { await modal('Стирание кодов', esc(errText(e)), [['OK', 0, 1]]); }
  if (cur().screen === 'faults') go('faults', cur().params, true);
}

async function runScan(rows) {
  const results = {};
  let i = 0;
  for (const m of MODULES) {
    if (cur().screen !== 'autoscan') return;
    rows[m.addr].cells[2].innerHTML = '<span class="badge b-run">Опрос…</span>';
    try {
      await cmd(m.addr, [0x00], 600);
      results[m.addr] = { ok: true };
      try {
        const f = await cmd(m.addr, [0x04], 800);
        results[m.addr].faults = f.code === 0xA0 ? (f.data.some(b => b) ? 'есть' : 'нет') : '?';
      } catch { results[m.addr].faults = '?'; }
    } catch { results[m.addr] = { ok: false }; }
    state.scan[m.addr] = results[m.addr].ok;
    fillScan(rows, results);
    $('scanBar').style.width = (++i / MODULES.length * 100) + '%';
  }
  const found = Object.values(results).filter(r => r.ok).length;
  const withF = Object.values(results).filter(r => r.faults === 'есть').length;
  $('scanState').textContent = `завершён: найдено блоков ${found}, с ошибками ${withF}`;
  cur().params.results = results;
  log('inf', `Автоскан: найдено ${found} из ${MODULES.length}.`);
}
function fillScan(rows, results) {
  for (const [addr, r] of Object.entries(results)) {
    const tr = rows[addr];
    tr.cells[2].innerHTML = r.ok ? '<span class="badge b-ok">Найден</span>' : '<span class="badge b-err">Нет ответа</span>';
    tr.cells[3].innerHTML = !r.ok ? '' : r.faults === 'есть' ? '<span class="badge b-warn">Есть ошибки</span>' : r.faults === 'нет' ? '<span class="badge b-ok">Нет ошибок</span>' : '<span class="badge b-wait">—</span>';
    if (r.ok) { tr.className = 'click'; tr.onclick = () => go('module', { addr: +addr }); }
  }
}

// --- Поток данных ---
function stopPoll() {
  if (state.poll) { state.poll.stop = true; state.poll = null; }
  const s = $('liveState'); if (s) s.textContent = 'остановлен';
}
async function startPoll(p) {
  if (state.poll) return;
  const job = { stop: false }; state.poll = job;
  $('liveState').textContent = 'идёт опрос…';
  while (!job.stop) {
    try {
      const r = await cmd(p.addr, [0x0B, 0x03]);
      if (job.stop) break;
      if (r.code !== 0xA0) { $('liveState').textContent = r.status; stopPoll(); break; }
      drawLive(p, r.data);
    } catch (e) { if (!job.stop) { $('liveState').textContent = errText(e); stopPoll(); } break; }
    await sleep(250);
  }
}
function drawLive(p, d, record = true) {
  if (record) {
    p.last = d;
    d.forEach((b, i) => { (p.hist[i] ??= []).push(b); if (p.hist[i].length > 120) p.hist[i].shift(); });
  }
  const tb = $('liveBody'); if (!tb) return;
  tb.innerHTML = d.map((b, i) => `<tr class="click${i === p.sel ? ' sel' : ''}" data-i="${i}"><td class="mono">${i}</td><td class="mono">${h1(b)}</td><td class="mono">${b}</td><td class="mono">${i + 1 < d.length ? (b << 8 | d[i + 1]) : ''}</td></tr>`).join('');
  tb.querySelectorAll('tr').forEach(tr => tr.onclick = () => { p.sel = +tr.dataset.i; drawLive(p, p.last, false); });
  drawGraph(p);
}
function drawGraph(p) {
  const c = $('graph'); if (!c) return;
  const data = p.hist[p.sel] || [];
  $('graphHead').innerHTML = `Байт ${p.sel}<b>${data.length ? data.at(-1) : '—'}</b>`;
  const dpr = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  g.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement), cv = n => css.getPropertyValue(n).trim();
  g.strokeStyle = cv('--line'); g.lineWidth = 1;
  for (let y = 0; y <= 4; y++) { g.beginPath(); g.moveTo(0, 10 + y * (H - 20) / 4); g.lineTo(W, 10 + y * (H - 20) / 4); g.stroke(); }
  if (data.length < 2) return;
  let lo = Math.min(...data), hi = Math.max(...data);
  if (hi - lo < 4) { lo -= 2; hi += 2; }
  g.fillStyle = cv('--muted'); g.font = '11px system-ui';
  g.fillText(hi, 4, 20); g.fillText(lo, 4, H - 14);
  g.strokeStyle = cv('--blue'); g.lineWidth = 2; g.beginPath();
  data.forEach((val, i) => {
    const x = W - (data.length - 1 - i) * (W / 119), y = 10 + (1 - (val - lo) / (hi - lo)) * (H - 20);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
}

async function sendRaw() {
  const out = $('rawOut');
  try {
    const addr = parseHex($('rawAddr').value)[0];
    const data = parseHex($('rawData').value);
    const msg = $('chkFrame').checked ? frame(addr, data) : [addr, ...data];
    out.innerHTML = '<div class="empty">Отправка…</div>';
    const r = await ds2(msg);
    const d = r.slice(3, -1);
    out.innerHTML = `<table class="grid"><tbody>
      <tr><td style="width:180px">Запрос</td><td class="mono">${hex(msg)}</td></tr>
      <tr><td>Ответ</td><td class="mono">${hex(r)}</td></tr>
      <tr><td>Статус</td><td><span class="badge ${r[2] === 0xA0 ? 'b-ok' : 'b-warn'}">${esc(RESP[r[2]] || 'Код ' + h1(r[2]))}</span></td></tr>
      <tr><td>Данные (ASCII)</td><td class="mono">${esc(ascii(d)) || '—'}</td></tr></tbody></table>`;
  } catch (e) { out.innerHTML = `<div class="empty"><span class="badge b-err">Ошибка</span><p>${esc(errText(e))}</p></div>`; }
}

// ===================== Тема =====================
const THEME_KEY = 'ds2-theme';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
function savedTheme() { try { return localStorage.getItem(THEME_KEY); } catch { return null; } }
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('themeBtn').innerHTML = t === 'dark' ? SUN : MOON;
  $('themeBtn').title = t === 'dark' ? 'Светлая тема' : 'Тёмная тема';
  if (cur()?.screen === 'live') drawGraph(cur().params);
}
$('themeBtn').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, t); } catch {}
  applyTheme(t);
};
const sysDark = matchMedia('(prefers-color-scheme: dark)');
sysDark.addEventListener('change', e => { if (!savedTheme()) applyTheme(e.matches ? 'dark' : 'light'); });

// ===================== Заставка =====================
(function splash() {
  const sp = $('splash');
  // Свой логотип: положите logo.png рядом с этим файлом — он заменит эмблему
  const img = new Image();
  img.onload = () => { $('spEmblem').innerHTML = ''; $('spEmblem').appendChild(img); };
  img.alt = '';
  img.src = 'logo.png';
  const close = () => { sp.classList.add('hide'); setTimeout(() => sp.remove(), 700); };
  sp.onclick = close;
  document.addEventListener('keydown', close, { once: true });
  setTimeout(close, matchMedia('(prefers-reduced-motion: reduce)').matches ? 600 : 2900);
})();

// ===================== Старт =====================
applyTheme(savedTheme() || (sysDark.matches ? 'dark' : 'light'));
setInterval(() => $('clock').textContent = new Date().toLocaleTimeString().slice(0, 5), 1000);
$('clock').textContent = new Date().toLocaleTimeString().slice(0, 5);
setVci(null);
state.stack = [{ screen: 'home', params: {} }];
render();
</script>
