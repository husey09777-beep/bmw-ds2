];
async function poloPoll() {
  if (state.poll) return;
  const job = { stop: false }; state.poll = job;
  syncPollButtons(); setLiveState('идёт опрос…');
  while (!job.stop) {
    for (const g of state.gauges) {
      if (job.stop) break;
      try { g.set(g.p.calc(await readPid(g.p.pid))); }
      catch (e) { if (e.message === 'timeout') { if (!job.stop) { stopPoll(); setLiveState('адаптер не отвечает'); } return; } }
    }
    await sleep(60);
  }
}

// Готовность систем (монитор OBD2) — то, что проверяют на техосмотре
const READINESS = [
  ['B', 0, 'Пропуски зажигания'], ['B', 1, 'Топливная система'], ['B', 2, 'Компоненты'],
  ['C', 0, 'Катализатор'], ['C', 1, 'Подогрев катализатора'], ['C', 2, 'Система улавливания паров топлива'],
  ['C', 3, 'Вторичный воздух'], ['C', 5, 'Лямбда-зонды'], ['C', 6, 'Подогрев лямбда-зондов'], ['C', 7, 'Рециркуляция газов (EGR)'],
];
function readinessRows(d) {
  const [A, B, C, D] = d;
  return READINESS.map(([byte, bit, name]) => {
    const supported = byte === 'B' ? B & (1 << bit) : C & (1 << bit);
    if (!supported) return null;
    const incomplete = byte === 'B' ? B & (1 << (bit + 4)) : D & (1 << bit);
    return { name, done: !incomplete };
  }).filter(Boolean);
}

async function poloClear() {
  if (state.clearing || needElm()) return;
  state.clearing = true;
  try {
    const ok = await modal('Стирание ошибок двигателя', 'Стереть коды неисправностей двигателя?<br><br>Вместе с ними сбросится <b>готовность систем</b> — после стирания машине нужно проездить несколько дней, прежде чем все проверки снова будут пройдены.<br><br>Двигатель должен быть заглушен, зажигание включено.', [['Отмена', false], ['Стереть', true, 1]]);
    if (!ok) return;
    try {
      const b = obdBytes(await obd('04', 5000));
      const done = b.includes(0x44);
      if (done) announce('Ошибки двигателя стёрты');
      await modal('Стирание ошибок', done ? 'Ошибки стёрты. Если неисправность осталась, код скоро появится снова.' : 'Блок не подтвердил стирание. Заглушите двигатель, оставьте зажигание включённым и попробуйте ещё раз.', [['OK', 0, 1]]);
    } catch (e) { await modal('Стирание ошибок', esc(e.message === 'timeout' ? 'Адаптер не ответил.' : e.message) + '<br><br>Проверьте подключение и попробуйте ещё раз.', [['OK', 0, 1]]); }
    if (cur().screen === 'polodtc') go('polodtc', cur().params, true);
  } finally { state.clearing = false; }
}

// ===================== Тема =====================
const THEME_KEY = 'ds2-theme';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
function savedTheme() { try { return localStorage.getItem(THEME_KEY); } catch { return null; } }
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('themeBtn').innerHTML = (t === 'dark' ? SUN : MOON).replace('<svg ', '<svg aria-hidden="true" focusable="false" ');
  $('themeBtn').title = t === 'dark' ? 'Светлая тема' : 'Тёмная тема';
  $('themeBtn').setAttribute('aria-label', t === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему');
  if (cur()?.screen === 'live') drawGraph(cur().params);
}
$('themeBtn').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, t); } catch {}
  applyTheme(t);
};
const sysDark = matchMedia('(prefers-color-scheme: dark)');
sysDark.addEventListener('change', e => { if (!savedTheme()) applyTheme(e.matches ? 'dark' : 'light'); });

// ===================== Заставка =====================
(function splash() {
  const sp = $('splash');
  // Свой логотип: положите logo.png рядом с этим файлом — он заменит эмблему
  const img = new Image();
  img.onload = () => { $('spEmblem').innerHTML = ''; $('spEmblem').appendChild(img); };
  img.alt = '';
  img.src = 'logo.png';
  // Заставка показывается один раз за сеанс: при обновлении страницы она не мешает
  let seen = false;
  try { seen = sessionStorage.getItem('ds2-splash') === '1'; sessionStorage.setItem('ds2-splash', '1'); } catch {}
  if (seen) { sp.remove(); return; }
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    sp.classList.add('hide'); setTimeout(() => sp.remove(), 450);
    document.removeEventListener('keydown', close);
  };
  sp.onclick = close;
  document.addEventListener('keydown', close);
  setTimeout(close, matchMedia('(prefers-reduced-motion: reduce)').matches ? 400 : 2300);
})();

applyTheme(savedTheme() || (sysDark.matches ? 'dark' : 'light'));
setInterval(() => $('clock').textContent = new Date().toLocaleTimeString().slice(0, 5), 1000);
$('clock').textContent = new Date().toLocaleTimeString().slice(0, 5);

(function initRoute() {
  const first = location.hash.replace(/^#\/?/, '').split('/')[0].split('-')[0];
  try { history.replaceState({ depth: 0 }, '', '#/'); } catch {}
  state.stack = [{ screen: 'home', params: {} }];
  render();
  if (OFFLINE_SCREENS.has(first)) go(first);
})();
